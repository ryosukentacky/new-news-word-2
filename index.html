発行すると何が起こるのか、順番に考えてみましょう。」<\/p><p>① 国（政府）<\/p><p>資金調達のため国債を発行<\/p><p>国債を発行<\/p><p>購入代金<\/p><p>② 投資家・銀行など<\/p><p>国債を購入して保有<\/p><p>国から利息・満期時の元本返済<\/p><p>「ここで重要なのは、国債を発行すれば国がお金を自由にもらえるわけではない、ということです。<\/p><p>借りたお金ですから、原則として返済する義務があるんですよ。<\/p><p>そして、国債にはもう一つ重要な特徴があります。<\/p><p>市場金利が上がると、既に発行されている固定利付国債の価格は下がりやすいんです。<\/p><p>なぜでしょう？<\/p><p>例えば、年利1%の国債を持っているときに、新しく年利3%の国債が発行されたらどうでしょう。<\/p><p>同じ条件なら、新しい3%の国債のほうが魅力的ですよね。<\/p><p>だから古い1%の国債を市場で売るには、価格を下げる必要が生じるんです。<\/p><p>ただし、満期まで保有して契約どおり償還されれば、市場価格の変動そのものによって額面の償還額が減るわけではありません。」<\/p><h2>C｜イメージ理解：身近な場面に置き換える<\/h2><p>「先輩、友達に10万円を貸す場面を想像してください。<\/p><p>友達が『1年後に10万円を返す。それまでに利息として1,000円も払う』と約束したとします。<\/p><p>これが国債の基本的なイメージです。<\/p><p>違うのは、お金を借りる相手が友達ではなく国だということですね。<\/p><p>ただし、国が発行しているからといって、あらゆる国債が絶対に安全というわけではありません。国の信用力や通貨、売却時の価格によってリスクは異なります。」<\/p><h2>D｜具体例：100万円の国債を買ったら？<\/h2><p>「では、先輩。額面100万円、年利2%、満期5年の固定利付国債を額面どおりに購入したと仮定しましょう。」<\/p><p>購入金額<\/p><h1>100万円<\/h1><p>年間利息（税引前）<\/p><h1>2万円<\/h1><p>年利を変えてみましょう<\/p><h2>2.0%<\/h2><p>年間利息<\/p><h2>20,000円<\/h2><p>5年間の利息合計<\/p><h2>100,000円<\/h2><p>税金・手数料を考慮せず、利息を再投資しない単純計算です。満期に額面100万円が償還される前提です。<\/p><p>「年利2%なら、5年間で利息は合計10万円です。<\/p><p>そして満期には元本100万円が返ってくるので、受取総額は110万円になります。<\/p><p>もちろん、これは税引前の計算ですよ。」<\/p><h2>類似する金融商品との違い<\/h2><table><tr><th>用語<\/th><th>特徴<\/th><\/tr><tr><td>国債<\/td><td>国がお金を借りる<\/td><\/tr><tr><td>地方債<\/td><td>地方自治体がお金を借りる<\/td><\/tr><tr><td>社債<\/td><td>企業がお金を借りる<\/td><\/tr><tr><td>株式<\/td><td>企業の持分を保有する<\/td><\/tr><\/table><p>「特に国債と株式を混同しないでくださいね。国債は基本的に貸し手になる仕組み、株式は企業の所有者の一人になる仕組みです。」<\/p><h2>理解確認｜3問<\/h2><p>Q1. 国債を購入するとは、基本的にどういうことですか？<\/p>国の株主になる国にお金を貸す国に税金を納める<p>Q2. 市場金利が上昇すると、既発の固定利付国債の価格は一般にどうなりますか？<\/p>上がる下がる必ず変わらない<p>Q3. 額面100万円、年利2%の国債の年間利息はいくらですか？<\/p>2,000円20,000円200,000円<h2>30秒復習<\/h2><p>「先輩、最後に頭の中を整理しますよ。<\/p><p>国債とは、国が資金を借りるために発行する債券です。購入者は原則として利息を受け取り、満期には元本の償還を受けます。<\/p><p>そして特に覚えてほしいのが、金利上昇 → 既発の固定利付国債の価格下落という関係です。」<\/p><h2>一文記憶<\/h2><p>国債は国がお金を借りるための債券であり、固定利付国債の市場価格は金利と逆方向に動く。<\/p><p>「ここまで理解できれば、次に『国債の利回り』『長期金利』『日銀の国債買い入れ』というニュースを読んだときにも、仕組みをつなげて考えられるようになりますよ、先輩。」<\/p><\/div>", "text": "① 国債（こくさい） 英語：Government Bond（ガバメント・ボンド） A｜要点：国債とは何か 「先輩、国債って聞くと、なんだか難しい金融商品のように感じませんか？ でも、仕組み自体は意外と単純なんですよ。 国債とは、国が投資家などからお金を借りるために発行する債券（借用証書のようなもの）です。 例えば、国が道路や橋を整備したいのに、税金だけでは必要なお金を賄えないとします。 そこで国は国債を発行して、投資家から資金を調達するんです。 そして、国債を購入した人には、契約条件に従って利息を支払い、満期には元本を返済します。 つまり、国債を買うということは、国にお金を貸すことなんですよ。」 B｜詳しい解説：国債の仕組み 「では先輩、国債を発行すると何が起こるのか、順番に考えてみましょう。」 ① 国（政府） 資金調達のため国債を発行 国債を発行 購入代金 ② 投資家・銀行など 国債を購入して保有 国から利息・満期時の元本返済 「ここで重要なのは、国債を発行すれば国がお金を自由にもらえるわけではない、ということです。 借りたお金ですから、原則として返済する義務があるんですよ。 そして、国債にはもう一つ重要な特徴があります。 市場金利が上がると、既に発行されている固定利付国債の価格は下がりやすいんです。 なぜでしょう？ 例えば、年利1%の国債を持っているときに、新しく年利3%の国債が発行されたらどうでしょう。 同じ条件なら、新しい3%の国債のほうが魅力的ですよね。 だから古い1%の国債を市場で売るには、価格を下げる必要が生じるんです。 ただし、満期まで保有して契約どおり償還されれば、市場価格の変動そのものによって額面の償還額が減るわけではありません。」 C｜イメージ理解：身近な場面に置き換える 「先輩、友達に10万円を貸す場面を想像してください。 友達が『1年後に10万円を返す。それまでに利息として1,000円も払う』と約束したとします。 これが国債の基本的なイメージです。 違うのは、お金を借りる相手が友達ではなく国だということですね。 ただし、国が発行しているからといって、あらゆる国債が絶対に安全というわけではありません。国の信用力や通貨、売却時の価格によってリスクは異なります。」 D｜具体例：100万円の国債を買ったら？ 「では、先輩。額面100万円、年利2%、満期5年の固定利付国債を額面どおりに購入したと仮定しましょう。」 購入金額 100万円 年間利息（税引前） 2万円 年利を変えてみましょう 2.0% 年間利息 20,000円 5年間の利息合計 100,000円 税金・手数料を考慮せず、利息を再投資しない単純計算です。満期に額面100万円が償還される前提です。 「年利2%なら、5年間で利息は合計10万円です。 そして満期には元本100万円が返ってくるので、受取総額は110万円になります。 もちろん、これは税引前の計算ですよ。」 類似する金融商品との違い 用語 特徴 国債 国がお金を借りる 地方債 地方自治体がお金を借りる 社債 企業がお金を借りる 株式 企業の持分を保有する 「特に国債と株式を混同しないでくださいね。国債は基本的に貸し手になる仕組み、株式は企業の所有者の一人になる仕組みです。」 理解確認｜3問 Q1. 国債を購入するとは、基本的にどういうことですか？ 国の株主になる国にお金を貸す国に税金を納める Q2. 市場金利が上昇すると、既発の固定利付国債の価格は一般にどうなりますか？ 上がる下がる必ず変わらない Q3. 額面100万円、年利2%の国債の年間利息はいくらですか？ 2,000円20,000円200,000円 30秒復習 「先輩、最後に頭の中を整理しますよ。 国債とは、国が資金を借りるために発行する債券です。購入者は原則として利息を受け取り、満期には元本の償還を受けます。 そして特に覚えてほしいのが、金利上昇 → 既発の固定利付国債の価格下落という関係です。」 一文記憶 国債は国がお金を借りるための債券であり、固定利付国債の市場価格は金利と逆方向に動く。 「ここまで理解できれば、次に『国債の利回り』『長期金利』『日銀の国債買い入れ』というニュースを読んだときにも、仕組みをつなげて考えられるようになりますよ、先輩。」"}, {"title": "② PBR（株価純資産倍率）", "html": "<div class=\"content\"><h1>② PBR（株価純資産倍率）<\/h1><p>英語：Price Book-value Ratio（プライス・ブックバリュー・レシオ）<\/p><h2>A｜要点：PBRとは何か<\/h2><p>「先輩、割安株を探すなら、PBRはぜひ理解しておきたい指標です。<\/p><p>でも、計算式だけ暗記するのは駄目ですよ。何を比較している数字なのか、そこまで理解していただきますからね。<\/p><p>PBRとは、企業の株価が、その企業の1株当たり純資産の何倍になっているかを示す指標です。<\/p><p>簡単に言えば、企業が持っている会計上の正味の財産に対して、株価が高いのか安いのかを見る数字なんです。」<\/p><p>PBRの計算式<\/p>\n\n$$\\text{PBR}=\\frac{\\text{株価}}{\\text{1株当たり純資産（BPS）}}$$\n\n<h2>0.5倍<\/h2><p>純資産の半分の評価<\/p><h2>1.0倍<\/h2><p>純資産と同水準<\/p><h2>2.0倍<\/h2><p>純資産の2倍の評価<\/p><p>「例えばPBRが0.5倍なら、企業の株式市場での評価額が、会計上の純資産の半分程度ということです。<\/p><p>ただし、先輩。PBRが低いから必ず割安、というわけではありません。<\/p><p>ここが一番間違えやすいところですよ。」<\/p><h2>B｜詳しい解説：なぜPBRが重要なのか<\/h2><h3>① まず純資産とは？<\/h3><p>「企業には現金や建物などの資産があります。でも、借金だってありますよね。<\/p><p>そこで、資産から負債を差し引いたものが純資産です。」<\/p>\n\n$$\\text{純資産}=\\text{資産}-\\text{負債}$$\n\n<p>「例えば、資産が10億円、負債が6億円なら、純資産は4億円です。<\/p><p>そして、この企業の株式市場での評価額、つまり時価総額が2億円だったらどうでしょう？」<\/p>\n\n$$\\text{PBR}=\\frac{2億円}{4億円}=0.5倍$$\n\n<p>「つまり、帳簿上の純資産4億円に対して、市場は株式全体を2億円と評価しているわけです。<\/p><p>なお、実際のPBR計算では、通常は普通株主に帰属する純資産を使います。」<\/p><h3>② なぜPBRが1倍を下回るのか？<\/h3><p>「ここ、少し考えてみてください。<\/p><p>純資産が4億円あるのに、なぜ市場は2億円としか評価しないのでしょう？」<\/p><p>主な理由は、将来の利益への不安です。<\/p><p>例えば、企業が毎年赤字を出していたら、今ある純資産も減っていくかもしれません。<\/p><p>あるいは、帳簿上は高価な工場でも、古くなって売却しようとしたら安くしか売れないかもしれません。<\/p><p>だから投資家は、帳簿上の数字をそのまま信用するとは限らないんです。<\/p><p>将来の収益力に不安がある<\/p><p>投資家が株を高く評価しなくなる<\/p><p>株価が下がり、PBRも低下する<\/p><p>「逆に、利益を大きく増やせる企業なら、純資産以上の価格がつくことも自然なんです。」<\/p><h3>③ ROEとの関係<\/h3><p>「先輩、PBRを見るならROEも一緒に覚えてください。<\/p><p>ROEは、自己資本を使ってどれだけ利益を生み出しているかを示す指標です。<\/p><p>基本的な関係式は次のとおりです。」<\/p>\n\n$$\\text{PBR}=\\text{PER}\\times\\text{ROE}$$\n\n<p>「例えばPERが10倍、ROEが5%なら、PBRは0.5倍になります。<\/p><p>一方、PERが同じ10倍でもROEが15%なら、PBRは1.5倍です。<\/p><p>つまり、純資産を使って利益を生み出す力も、PBRを考えるうえで重要なんですよ。」<\/p><p>※ この関係式は、PER・PBR・ROEの分母や利益の定義、対象期間が整合している場合に成立します。<\/p><h2>C｜イメージ理解：会社を丸ごと買うとしたら？<\/h2><p>「先輩、今度は会社を一軒のお店に置き換えて考えてください。」<\/p><img alt=\"Image\" class=\"exported-media\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAARcAAACWCAYAAAD0SMwdAAAQAElEQVR4AexdB3xUxfb+7t3NpvfeeycIWABF5UmyKyCKBcUG2Q1iAyu7QcoDlfJE+VvA8qygPlGxYUFFVFSKiCBVaugBQg8hIaTs/c9M2JDIAgGymy1nf/fcMu3M+Wbm2yl3dmXQhxAgBAgBGyBA5GIDUClJQo 3leM5nqZEAF46BgtmMByYpMF8PxfMR3UsrVzNsT3uckVxErFtn1m+cOO2zknHTTJsmTLtx4/jpV5K0DgYl46flbxo3bUjJhOnvrnuShkKivl3g6YYXV5ddO3XFO72mrrif9WZ695yy/EqSVsJg6vLevV5aXsznWHpNWWx1+blp8Z2dXJqGpntCwBUQIBvsggCRi11gJiWEgPshQOTifmVOFhMCdkGAyMUuMJMSQsD9EPh/AAAA//+ICz25AAAABklEQVQDAEwJ/bObC8qiAAAAAElFTkSuQmCC\"/>帳簿上の純資産が1億円でも、市場では5,000万円と評価されることがあります。<p>「例えば、純資産1億円のお店が5,000万円で売られていたら、先輩はどう思います？<\/p><p>『安い！』と思いますよね。<\/p><p>でも、ちょっと待ってください。<\/p><p>そのお店が毎年1,000万円の赤字を出していたら？<\/p><p>設備が古くて、今後大規模な修繕が必要だったら？<\/p><p>そう考えると、安く売られていることにも理由があるかもしれません。<\/p><p>これが、低PBR株を選ぶときに注意するべきことなんです。」<\/p><h2>D｜具体例：PBRを計算してみましょう<\/h2><p>「では先輩、実際に数字を動かして確認しましょう。」<\/p><p>株価<\/p><h2>500円<\/h2><p>1株当たり純資産（BPS）<\/p><h2>1,000円<\/h2><p>計算されたPBR<\/p><h1>0.50倍<\/h1><p>500円 ÷ 1,000円<\/p><p>純資産に対して市場評価が低い状態<\/p><p>純資産<\/p><p>株価<\/p><p>「初期値なら、株価500円をBPS1,000円で割るので、PBRは0.5倍ですね。<\/p><p>株価だけを上げるとPBRも上がり、BPSだけを増やすとPBRは下がります。<\/p><p>ただし、現実の株式市場では、株価もBPSも企業活動や投資家の評価によって変化します。」<\/p><h2>類似する投資指標との違い<\/h2><table><tr><th>指標<\/th><th>比較するもの<\/th><th>注目する点<\/th><\/tr><tr><td>PBR<\/td><td>株価と純資産<\/td><td>資産面からの評価<\/td><\/tr><tr><td>PER<\/td><td>株価と利益<\/td><td>利益面からの評価<\/td><\/tr><tr><td>ROE<\/td><td>利益と自己資本<\/td><td>資本を使う効率<\/td><\/tr><tr><td>ROA<\/td><td>利益と総資産<\/td><td>資産全体を使う効率<\/td><\/tr><\/table><p>「割安株を探すなら、PBRだけでなく、PERやROE、負債の状況、将来の利益も一緒に確認してくださいね。」<\/p><h2>理解確認｜3問<\/h2><p>Q1. PBRが0.5倍とは、どういう意味ですか？<\/p>株価が利益の半分市場評価が純資産の半分程度企業の借金が半分<p>Q2. PBRが0.5倍の企業は必ず割安ですか？<\/p>必ず割安必ず割高必ずしも割安ではない<p>Q3. 株価600円、BPS1,200円のPBRは？<\/p>0.5倍2倍6倍<h2>30秒復習<\/h2><p>「先輩、最後に重要なところを整理しますよ。」<\/p><ul><li><p>何の指標？ 株価が1株当たり純資産の何倍かを見る指標。<\/p><\/li><li><p>計算式は？ 株価 ÷ BPS。<\/p><\/li><li><p>1倍未満なら？ 市場評価が会計上の純資産より低い。<\/p><\/li><li><p>なぜ低くなる？ 将来の収益力や資産価値への不安など。<\/p><\/li><li><p>注意点は？ 低PBR＝必ず割安ではない。<\/p><\/li><li><p>一緒に見る指標は？ PER、ROE、財務状況など。<\/p><\/li><\/ul><h2>一文記憶<\/h2><p>PBRは株価と純資産を比較する指標で、1倍未満でも収益力や将来性を確認しなければ本当に割安とは判断できない。<\/p><p>「先輩、PBRが低い株を見つけたら、すぐに飛びつくのではなく、『なぜ市場はこの会社を安く評価しているんだろう？』と考えるんです。<\/p><p>その理由を調べることが、割安株投資の大切な第一歩ですよ。」<\/p><\/div>", "text": "② PBR（株価純資産倍率） 英語：Price Book-value Ratio（プライス・ブックバリュー・レシオ） A｜要点：PBRとは何か 「先輩、割安株を探すなら、PBRはぜひ理解しておきたい指標です。 でも、計算式だけ暗記するのは駄目ですよ。何を比較している数字なのか、そこまで理解していただきますからね。 PBRとは、企業の株価が、その企業の1株当たり純資産の何倍になっているかを示す指標です。 簡単に言えば、企業が持っている会計上の正味の財産に対して、株価が高いのか安いのかを見る数字なんです。」 PBRの計算式 $$\\text{PBR}=\\frac{\\text{株価}}{\\text{1株当たり純資産（BPS）}}$$ 0.5倍 純資産の半分の評価 1.0倍 純資産と同水準 2.0倍 純資産の2倍の評価 「例えばPBRが0.5倍なら、企業の株式市場での評価額が、会計上の純資産の半分程度ということです。 ただし、先輩。PBRが低いから必ず割安、というわけではありません。 ここが一番間違えやすいところですよ。」 B｜詳しい解説：なぜPBRが重要なのか ① まず純資産とは？ 「企業には現金や建物などの資産があります。でも、借金だってありますよね。 そこで、資産から負債を差し引いたものが純資産です。」 $$\\text{純資産}=\\text{資産}-\\text{負債}$$ 「例えば、資産が10億円、負債が6億円なら、純資産は4億円です。 そして、この企業の株式市場での評価額、つまり時価総額が2億円だったらどうでしょう？」 $$\\text{PBR}=\\frac{2億円}{4億円}=0.5倍$$ 「つまり、帳簿上の純資産4億円に対して、市場は株式全体を2億円と評価しているわけです。 なお、実際のPBR計算では、通常は普通株主に帰属する純資産を使います。」 ② なぜPBRが1倍を下回るのか？ 「ここ、少し考えてみてください。 純資産が4億円あるのに、なぜ市場は2億円としか評価しないのでしょう？」 主な理由は、将来の利益への不安です。 例えば、企業が毎年赤字を出していたら、今ある純資産も減っていくかもしれません。 あるいは、帳簿上は高価な工場でも、古くなって売却しようとしたら安くしか売れないかもしれません。 だから投資家は、帳簿上の数字をそのまま信用するとは限らないんです。 将来の収益力に不安がある 投資家が株を高く評価しなくなる 株価が下がり、PBRも低下する 「逆に、利益を大きく増やせる企業なら、純資産以上の価格がつくことも自然なんです。」 ③ ROEとの関係 「先輩、PBRを見るならROEも一緒に覚えてください。 ROEは、自己資本を使ってどれだけ利益を生み出しているかを示す指標です。 基本的な関係式は次のとおりです。」 $$\\text{PBR}=\\text{PER}\\times\\text{ROE}$$ 「例えばPERが10倍、ROEが5%なら、PBRは0.5倍になります。 一方、PERが同じ10倍でもROEが15%なら、PBRは1.5倍です。 つまり、純資産を使って利益を生み出す力も、PBRを考えるうえで重要なんですよ。」 ※ この関係式は、PER・PBR・ROEの分母や利益の定義、対象期間が整合している場合に成立します。 C｜イメージ理解：会社を丸ごと買うとしたら？ 「先輩、今度は会社を一軒のお店に置き換えて考えてください。」 帳簿上の純資産が1億円でも、市場では5,000万円と評価されることがあります。 「例えば、純資産1億円のお店が5,000万円で売られていたら、先輩はどう思います？ 『安い！』と思いますよね。 でも、ちょっと待ってください。 そのお店が毎年1,000万円の赤字を出していたら？ 設備が古くて、今後大規模な修繕が必要だったら？ そう考えると、安く売られていることにも理由があるかもしれません。 これが、低PBR株を選ぶときに注意するべきことなんです。」 D｜具体例：PBRを計算してみましょう 「では先輩、実際に数字を動かして確認しましょう。」 株価 500円 1株当たり純資産（BPS） 1,000円 計算されたPBR 0.50倍 500円 ÷ 1,000円 純資産に対して市場評価が低い状態 純資産 株価 「初期値なら、株価500円をBPS1,000円で割るので、PBRは0.5倍ですね。 株価だけを上げるとPBRも上がり、BPSだけを増やすとPBRは下がります。 ただし、現実の株式市場では、株価もBPSも企業活動や投資家の評価によって変化します。」 類似する投資指標との違い 指標 比較するもの 注目する点 PBR 株価と純資産 資産面からの評価 PER 株価と利益 利益面からの評価 ROE 利益と自己資本 資本を使う効率 ROA 利益と総資産 資産全体を使う効率 「割安株を探すなら、PBRだけでなく、PERやROE、負債の状況、将来の利益も一緒に確認してくださいね。」 理解確認｜3問 Q1. PBRが0.5倍とは、どういう意味ですか？ 株価が利益の半分市場評価が純資産の半分程度企業の借金が半分 Q2. PBRが0.5倍の企業は必ず割安ですか？ 必ず割安必ず割高必ずしも割安ではない Q3. 株価600円、BPS1,200円のPBRは？ 0.5倍2倍6倍 30秒復習 「先輩、最後に重要なところを整理しますよ。」 何の指標？ 株価が1株当たり純資産の何倍かを見る指標。 計算式は？ 株価 ÷ BPS。 1倍未満なら？ 市場評価が会計上の純資産より低い。 なぜ低くなる？ 将来の収益力や資産価値への不安など。 注意点は？ 低PBR＝必ず割安ではない。 一緒に見る指標は？ PER、ROE、財務状況など。 一文記憶 PBRは株価と純資産を比較する指標で、1倍未満でも収益力や将来性を確認しなければ本当に割安とは判断できない。 「先輩、PBRが低い株を見つけたら、すぐに飛びつくのではなく、『なぜ市場はこの会社を安く評価しているんだろう？』と考えるんです。 その理由を調べることが、割安株投資の大切な第一歩ですよ。」"}, {"title": "③ PSR（株価売上高倍率）", "html": "<div class=\"content\"><h1>③ PSR（株価売上高倍率）<\/h1><p>英語：Price to Sales Ratio（プライス・トゥ・セールス・レシオ）<\/p><h2>A｜要点：PSRとは何か<\/h2><p>「先輩、前回のPBRは、企業の純資産に対して株価が高いか安いかを見る指標でしたよね。<\/p><p>では、まだ利益を出していない企業の株価が割安かどうかを判断したい場合は、どうしましょう？<\/p><p>PERは利益を基準にするので、赤字企業では通常の意味で評価できません。<\/p><p>そこで役立つのが、今回の**PSR（株価売上高倍率）**なんです。<\/p><p>PSRとは、企業の時価総額が年間売上高の何倍になっているかを示す指標です。<\/p><p>簡単に言えば、企業が1年間で生み出す売上高に対して、株式市場がその企業にどれくらいの価値をつけているかを見るものですね。」<\/p><p>PSRの計算式<\/p>\n\n$$\\text{PSR}=\\frac{\\text{時価総額}}{\\text{年間売上高}}$$\n\n<h2>0.5倍<\/h2><p>売上高の半分<\/p><h2>1.0倍<\/h2><p>売上高と同額<\/p><h2>5.0倍<\/h2><p>売上高の5倍<\/p><p>「例えば、年間売上高100億円の会社の時価総額が200億円なら、PSRは2倍です。<\/p><p>ただし先輩、ここは勘違いしないでください。<\/p><p>PSRが低いからといって、必ずしも割安な株式とは限りません。<\/p><p>売上高が大きくても、利益がほとんど出ていない企業だってありますからね。」<\/p><h2>B｜詳しい解説：なぜPSRで企業を評価するのか<\/h2><h3>① なぜ売上高を使うのか<\/h3><p>「まず、企業が利益を生み出す流れを考えてみましょう。<\/p><p>例えば、商品を100万円売り上げたとします。<\/p><p>でも、その商品を作るために80万円かかって、さらに人件費や家賃が30万円かかっていたらどうでしょう？<\/p><p>売上高は100万円でも、営業損益は10万円の赤字ですよね。<\/p><p>つまり、売上高と利益は別物なんです。<\/p><p>では、赤字企業に価値はないのでしょうか？<\/p><p>そうとも限りません。<\/p><p>事業を急速に拡大している企業は、研究開発や広告などに多額の費用を使い、一時的に赤字になっている場合があります。<\/p><p>そんな企業でも売上高が成長しているなら、将来の利益につながる可能性があります。<\/p><p>だから、利益だけでは評価しにくい企業を比較するときに、PSRが使われるんです。」<\/p><h3>② PSRが高くなる理由<\/h3><p>「では先輩、売上高が同じ100億円でも、時価総額が100億円の会社と500億円の会社があるのはなぜでしょう？<\/p><p>投資家が将来の成長性や利益率を違って評価しているからです。」<\/p><p>売上高が急速に成長する見込み<\/p><p>将来の利益拡大が期待される<\/p><p>投資家が高い株価でも購入する<\/p><p>時価総額が上昇し、PSRが高くなる<\/p><p>「逆に、売上高が伸び悩んでいたり、利益率が低かったりすると、PSRは低く評価されやすくなります。<\/p><p>ただし、PSRが高い企業の将来が必ず明るいという意味ではありません。期待が過剰であれば、株価が大きく下がることもあります。」<\/p><h3>③ PSRと利益率の関係<\/h3><p>「ここは割安株投資をするなら特に重要です。<\/p><p>同じPSR1倍の会社でも、利益率が違えば投資対象としての魅力も変わります。」<\/p><table><tr><th>項目<\/th><th>A社<\/th><th>B社<\/th><\/tr><tr><td>売上高<\/td><td>100億円<\/td><td>100億円<\/td><\/tr><tr><td>時価総額<\/td><td>100億円<\/td><td>100億円<\/td><\/tr><tr><td>PSR<\/td><td>1倍<\/td><td>1倍<\/td><\/tr><tr><td>純利益<\/td><td>20億円<\/td><td>2億円<\/td><\/tr><tr><td>純利益率<\/td><td>20%<\/td><td>2%<\/td><\/tr><tr><td>PER<\/td><td>5倍<\/td><td>50倍<\/td><\/tr><\/table><p>「先輩、どちらもPSRは1倍ですよね。<\/p><p>でも、A社は20億円の利益を生み出す一方、B社は2億円しか利益を出していません。<\/p><p>利益が同じ水準で続くと仮定すれば、A社のほうが利益に対する株価は低いわけです。<\/p><p>つまり、PSRを見るときには、利益率も必ず確認したいんです。」<\/p><p>なお、時価総額・売上高・純利益の期間や定義が整合していれば、次の関係が成立します。<\/p>\n\n$$\\text{PSR}=\\text{PER}\\times\\text{純利益率}$$\n\n<h2>C｜イメージ理解：2つの飲食店を比較<\/h2><p>「先輩、今度は2つの飲食店を想像してください。」<\/p><img alt=\"古民家カフェの外観０３ - No: 31525217｜写真素材なら「写真AC」無料（フリー）ダウンロードOK\" class=\"exported-media\" src=\"https://images.openai.com/static-rsc-4/7renCa_-2NqRQzWkLvPtskYKXhxfztLF9uJmTp2D0o8zuyJUw7GEKc0XCyWvoZAba3gW7SQoglYMmh3XVD0F_OoRIMgzi3MpzSzm2i2sCFNe-5Lqv9bh0KjlLsgo3w1yAJcoM0b3CqEjotfNThSoUpvkAzAZBP7hTZvohxy7JeA?purpose=inline\"/><p>A店：利益率が高い店<\/p><p>売上高1億円、利益2,000万円。少ない売上でもしっかり利益を残せます。<\/p><img alt=\"新時代溝の口店オープン | サノイズムbyさのなおし\" class=\"exported-media\" src=\"https://images.openai.com/static-rsc-4/j1J4lODq6P5DNw2NbXNu1nklFClmI2cmYtJxD8BgCfFwH-JemBQ80YiEQu6drNSGXHw9K3RO3BpOgrpuN7UczXZ99lgCqY6lMO4BPCEQN_CKfb4bqdkBNAQB3lJAfmeEJB3nRW231V1L_aX4TuOgZJnmfbg3V1cheanQVfrEfw8?purpose=inline\"/><p>B店：利益率が低い店<\/p><p>売上高1億円、利益200万円。売上は同じでも費用が多くかかっています。<\/p><p>「この2店舗をそれぞれ1億円で買えるとしたら、PSRはどちらも1倍です。<\/p><p>でも、利益は10倍違いますよね。<\/p><p>もちろん、B店のほうが今後大きく成長する可能性もあります。<\/p><p>だからこそ、PSRだけで判断せず、利益率や成長率も合わせて見る必要があるんです。」<\/p><h2>D｜具体例：PSRを計算してみましょう<\/h2><p>「では先輩、時価総額と売上高を動かして、PSRがどう変わるか確認してみてください。」<\/p><p>時価総額<\/p><h2>200億円<\/h2><p>年間売上高<\/p><h2>100億円<\/h2><p>計算されたPSR<\/p><h1>2.00倍<\/h1><p>200億円 ÷ 100億円<\/p><p>時価総額が年間売上高を上回っています<\/p><p>時価総額<\/p><p>売上高<\/p><p>「初期値なら、200億円÷100億円なのでPSRは2倍です。<\/p><p>時価総額だけが上がればPSRは高くなり、時価総額が変わらないまま売上高が増えればPSRは低くなります。<\/p><p>ただし、実際には売上高の増加を受けて株価も上昇する場合がありますから、単純にPSRが下がるとは限りませんよ。」<\/p><h2>類似する投資指標との違い<\/h2><table><tr><th>指標<\/th><th>計算式<\/th><th>主な用途<\/th><\/tr><tr><td>PSR<\/td><td>時価総額÷売上高<\/td><td>売上高に対する評価<\/td><\/tr><tr><td>PER<\/td><td>時価総額÷純利益<\/td><td>利益に対する評価<\/td><\/tr><tr><td>PBR<\/td><td>株価÷BPS<\/td><td>純資産に対する評価<\/td><\/tr><tr><td>ROE<\/td><td>純利益÷自己資本<\/td><td>自己資本の収益性<\/td><\/tr><\/table><p>「PSRは、特に成長企業や赤字企業を分析するときに役立ちます。<\/p><p>一方、利益が安定している企業ならPERやROEも重要ですし、資産を多く保有する企業ならPBRも参考になります。<\/p><p>業種によって適切な比較指標は異なりますから、同業他社と比べることも大切ですね。」<\/p><h2>理解確認｜3問<\/h2><p>Q1. PSRは何を比較する指標ですか？<\/p>時価総額と売上高株価と純資産利益と自己資本<p>Q2. 赤字企業でもPSRを計算できる理由は？<\/p>赤字でも必ず純資産があるから利益ではなく売上高を使うから赤字企業の株価は一定だから<p>Q3. 時価総額300億円、売上高150億円ならPSRは？<\/p>0.5倍2倍3倍<h2>30秒復習<\/h2><p>「先輩、最後に確認しますよ。」<\/p><ul><li><p>何の指標？ 時価総額が年間売上高の何倍かを見る指標。<\/p><\/li><li><p>計算式は？ 時価総額÷年間売上高。<\/p><\/li><li><p>どんな企業に使う？ 成長企業や赤字企業など。<\/p><\/li><li><p>PSRが高い理由は？ 将来の成長や高い利益率への期待など。<\/p><\/li><li><p>PSRが低い理由は？ 成長性や収益性への不安など。<\/p><\/li><li><p>注意点は？ 売上高が大きくても、利益が出ているとは限らない。<\/p><\/li><\/ul><h2>一文記憶<\/h2><p>PSRは企業の時価総額を売上高で割った指標で、赤字企業の評価にも使えるが、利益率や成長性と合わせて判断する必要がある。<\/p><p>「先輩、PBRが純資産、PERが利益、PSRが売上高を基準にする指標だと整理できましたね。<\/p><p>割安株を探すときには、単に倍率が低い企業ではなく、その倍率が低くなっている理由を見つけることが重要なんです。」<\/p><\/div>", "text": "③ PSR（株価売上高倍率） 英語：Price to Sales Ratio（プライス・トゥ・セールス・レシオ） A｜要点：PSRとは何か 「先輩、前回のPBRは、企業の純資産に対して株価が高いか安いかを見る指標でしたよね。 では、まだ利益を出していない企業の株価が割安かどうかを判断したい場合は、どうしましょう？ PERは利益を基準にするので、赤字企業では通常の意味で評価できません。 そこで役立つのが、今回の**PSR（株価売上高倍率）**なんです。 PSRとは、企業の時価総額が年間売上高の何倍になっているかを示す指標です。 簡単に言えば、企業が1年間で生み出す売上高に対して、株式市場がその企業にどれくらいの価値をつけているかを見るものですね。」 PSRの計算式 $$\\text{PSR}=\\frac{\\text{時価総額}}{\\text{年間売上高}}$$ 0.5倍 売上高の半分 1.0倍 売上高と同額 5.0倍 売上高の5倍 「例えば、年間売上高100億円の会社の時価総額が200億円なら、PSRは2倍です。 ただし先輩、ここは勘違いしないでください。 PSRが低いからといって、必ずしも割安な株式とは限りません。 売上高が大きくても、利益がほとんど出ていない企業だってありますからね。」 B｜詳しい解説：なぜPSRで企業を評価するのか ① なぜ売上高を使うのか 「まず、企業が利益を生み出す流れを考えてみましょう。 例えば、商品を100万円売り上げたとします。 でも、その商品を作るために80万円かかって、さらに人件費や家賃が30万円かかっていたらどうでしょう？ 売上高は100万円でも、営業損益は10万円の赤字ですよね。 つまり、売上高と利益は別物なんです。 では、赤字企業に価値はないのでしょうか？ そうとも限りません。 事業を急速に拡大している企業は、研究開発や広告などに多額の費用を使い、一時的に赤字になっている場合があります。 そんな企業でも売上高が成長しているなら、将来の利益につながる可能性があります。 だから、利益だけでは評価しにくい企業を比較するときに、PSRが使われるんです。」 ② PSRが高くなる理由 「では先輩、売上高が同じ100億円でも、時価総額が100億円の会社と500億円の会社があるのはなぜでしょう？ 投資家が将来の成長性や利益率を違って評価しているからです。」 売上高が急速に成長する見込み 将来の利益拡大が期待される 投資家が高い株価でも購入する 時価総額が上昇し、PSRが高くなる 「逆に、売上高が伸び悩んでいたり、利益率が低かったりすると、PSRは低く評価されやすくなります。 ただし、PSRが高い企業の将来が必ず明るいという意味ではありません。期待が過剰であれば、株価が大きく下がることもあります。」 ③ PSRと利益率の関係 「ここは割安株投資をするなら特に重要です。 同じPSR1倍の会社でも、利益率が違えば投資対象としての魅力も変わります。」 項目 A社 B社 売上高 100億円 100億円 時価総額 100億円 100億円 PSR 1倍 1倍 純利益 20億円 2億円 純利益率 20% 2% PER 5倍 50倍 「先輩、どちらもPSRは1倍ですよね。 でも、A社は20億円の利益を生み出す一方、B社は2億円しか利益を出していません。 利益が同じ水準で続くと仮定すれば、A社のほうが利益に対する株価は低いわけです。 つまり、PSRを見るときには、利益率も必ず確認したいんです。」 なお、時価総額・売上高・純利益の期間や定義が整合していれば、次の関係が成立します。 $$\\text{PSR}=\\text{PER}\\times\\text{純利益率}$$ C｜イメージ理解：2つの飲食店を比較 「先輩、今度は2つの飲食店を想像してください。」 A店：利益率が高い店 売上高1億円、利益2,000万円。少ない売上でもしっかり利益を残せます。 B店：利益率が低い店 売上高1億円、利益200万円。売上は同じでも費用が多くかかっています。 「この2店舗をそれぞれ1億円で買えるとしたら、PSRはどちらも1倍です。 でも、利益は10倍違いますよね。 もちろん、B店のほうが今後大きく成長する可能性もあります。 だからこそ、PSRだけで判断せず、利益率や成長率も合わせて見る必要があるんです。」 D｜具体例：PSRを計算してみましょう 「では先輩、時価総額と売上高を動かして、PSRがどう変わるか確認してみてください。」 時価総額 200億円 年間売上高 100億円 計算されたPSR 2.00倍 200億円 ÷ 100億円 時価総額が年間売上高を上回っています 時価総額 売上高 「初期値なら、200億円÷100億円なのでPSRは2倍です。 時価総額だけが上がればPSRは高くなり、時価総額が変わらないまま売上高が増えればPSRは低くなります。 ただし、実際には売上高の増加を受けて株価も上昇する場合がありますから、単純にPSRが下がるとは限りませんよ。」 類似する投資指標との違い 指標 計算式 主な用途 PSR 時価総額÷売上高 売上高に対する評価 PER 時価総額÷純利益 利益に対する評価 PBR 株価÷BPS 純資産に対する評価 ROE 純利益÷自己資本 自己資本の収益性 「PSRは、特に成長企業や赤字企業を分析するときに役立ちます。 一方、利益が安定している企業ならPERやROEも重要ですし、資産を多く保有する企業ならPBRも参考になります。 業種によって適切な比較指標は異なりますから、同業他社と比べることも大切ですね。」 理解確認｜3問 Q1. PSRは何を比較する指標ですか？ 時価総額と売上高株価と純資産利益と自己資本 Q2. 赤字企業でもPSRを計算できる理由は？ 赤字でも必ず純資産があるから利益ではなく売上高を使うから赤字企業の株価は一定だから Q3. 時価総額300億円、売上高150億円ならPSRは？ 0.5倍2倍3倍 30秒復習 「先輩、最後に確認しますよ。」 何の指標？ 時価総額が年間売上高の何倍かを見る指標。 計算式は？ 時価総額÷年間売上高。 どんな企業に使う？ 成長企業や赤字企業など。 PSRが高い理由は？ 将来の成長や高い利益率への期待など。 PSRが低い理由は？ 成長性や収益性への不安など。 注意点は？ 売上高が大きくても、利益が出ているとは限らない。 一文記憶 PSRは企業の時価総額を売上高で割った指標で、赤字企業の評価にも使えるが、利益率や成長性と合わせて判断する必要がある。 「先輩、PBRが純資産、PERが利益、PSRが売上高を基準にする指標だと整理できましたね。 割安株を探すときには、単に倍率が低い企業ではなく、その倍率が低くなっている理由を見つけることが重要なんです。」"}, {"title": "④ PHP（ピー・エイチ・ピー）", "html": "<div class=\"content\"><h1>④ PHP（ピー・エイチ・ピー）<\/h1><p>正式名称：PHP: Hypertext Preprocessor<\/p><h2>A｜要点：PHPとは何か<\/h2><p>「先輩、PHPですね。前回までのPBRやPSRとは違って、今回はプログラミングの用語です。<\/p><p>PHPとは、Webサイトの裏側（サーバー側）で動くプログラミング言語のことです。<\/p><p>例えば、ネットショップで商品を検索したり、ログインしたり、会員情報を表示したりするときに使われます。<\/p><p>まずは、HTMLとの違いを覚えましょう。」<\/p><ul><li><p>HTML： Webページの文章や構造を作る。<\/p><\/li><li><p>CSS： 色や配置など、見た目を整える。<\/p><\/li><li><p>JavaScript： 画面上の操作や動きなどを実現する。<\/p><\/li><li><p>PHP： サーバー側でデータを処理し、必要に応じてHTMLなどを生成する。<\/p><\/li><\/ul><p>「つまりPHPは、利用者から見えない場所で仕事をする、Webサイトの裏方なんです。」<\/p><h2>B｜詳しい解説：PHPはどう動くのか<\/h2><p>「先輩、ログイン画面を想像してください。<\/p><p>IDとパスワードを入力してログインボタンを押すと、なぜ自分専用のページが表示されるのでしょう？<\/p><p>そこには、次のような処理があります。」<\/p><p>① 利用者のブラウザ<\/p><p>ログイン情報を送信<\/p><p>HTTPSでサーバーへ送信<\/p><p>② Webサーバー上のPHP<\/p><p>ログイン情報を検証する処理を実行<\/p><p>必要に応じてデータベースを参照<\/p><p>③ データベース<\/p><p>利用者情報などを管理<\/p><p>処理結果をブラウザに返す<\/p><p>④ 利用者の画面<\/p><p>ログイン結果や専用ページを表示<\/p><p>「ここで重要なのは、PHPのプログラム自体は通常、利用者のブラウザに送られないということです。<\/p><p>サーバーでPHPが実行され、その結果としてHTMLなどが送られてくるんですよ。<\/p><p>ちなみに、PHPだけがサーバー側で動く言語というわけではありません。PythonやJavaScript（Node.js）なども同じような役割を担えます。」<\/p><h2>C｜イメージ理解：レストランに例えると？<\/h2><p>「先輩、レストランで料理を注文する場面を想像してください。」<\/p><img alt=\"Saltmarsh Kitchen Seven Sisters - Saltmarsh Farmhouse\" class=\"exported-media\" src=\"https://images.openai.com/static-rsc-4/dWPoqsrDruIABIiligWynHsdF0csIrA3jDqSRmJ7tRATqmm2XNf_yOckqOLs_1lAZFNfNLaqnS-k3GMekG3cN1g2RO8TZt_30Tbr2picPwGWBNJ0jUQCUhhpFjUpZ04xHJC6fBZTq_FhJD6CMv92QfyQYKQbkVOmYeoDq_OMmSA?purpose=inline\"/><p>HTML・CSS<\/p><p>お客さんが見るメニューや、そのデザインに相当します。<\/p><img alt=\"Профессия повар — разряды, специализации, карьера, зарплата | УЦ ОбрПрофи\" class=\"exported-media\" src=\"https://images.openai.com/static-rsc-4/lLdmGwsyMXEr_DqMUUOD1eC0ACi9NLvpFfLyiP9vbqYNiwVOf6tdg2kKBGtorRr530O2HX7Sm3xFZkkUwsJblJMxZK10TnCYt5huZ4nTe5iEal4W8BxOm4EKEDIcOmb9UPG7BYeP0iwYF4nsfSW_gYcYEe6PDAlS-92W5RM9wDM?purpose=inline\"/><p>PHP<\/p><p>注文を受けて、厨房の中で料理を準備する役割です。<\/p><p>「お客さんは料理を注文しますが、厨房でどんな手順で作っているかは見えませんよね。<\/p><p>PHPも同じです。<\/p><p>利用者がボタンを押すと、サーバー側で必要な処理を行い、その結果だけを画面に返します。<\/p><p>ただし、JavaScriptも注文内容を確認したり、画面を切り替えたりできます。必ずPHPを通さないと動的なページが作れない、というわけではありませんよ。」<\/p><h2>D｜具体例：PHPで何ができる？<\/h2><p>「では先輩、実際にPHPのコードを見てみましょう。」<\/p>PHP<pre><code>&lt;?php\n$name = \"田中\";\n\necho \"こんにちは、\" . $name . \"さん！\";\n?&gt;<\/code><\/pre><p>「このコードをPHPが実行すると、次の文章が出力されます。」<\/p>こんにちは、田中さん！<p>「<code>$name<\/code>は変数です。名前などのデータを一時的に保存する箱だと思ってください。<\/p><p>そして<code>echo<\/code>は、文字列などを出力するための命令です。<\/p><p>ここでは変数に保存した名前を使って、表示する文章を作っているんですね。」<\/p><h3>PHPとJavaScriptの違いを体験<\/h3><p>「下のボタンは、JavaScriptのようなブラウザ側の動きをイメージするための例です。実際にPHPを実行しているわけではありません。」<\/p>表示する名前<h2>こんにちは、田中さん！<\/h2><p>この例はブラウザ上で表示内容を変更しています。PHPならサーバー側で同様の文字列を生成できます。<\/p><h2>PHPとほかの言語との違い<\/h2><table><tr><th>技術<\/th><th>主な役割<\/th><\/tr><tr><td>HTML<\/td><td>ページの構造<\/td><\/tr><tr><td>CSS<\/td><td>ページの装飾<\/td><\/tr><tr><td>JavaScript<\/td><td>画面操作・サーバー処理<\/td><\/tr><tr><td>PHP<\/td><td>サーバー側の処理<\/td><\/tr><tr><td>SQL<\/td><td>データベースの操作<\/td><\/tr><\/table><p>「先輩、PHPとSQLは特に混同しやすいので注意してください。<\/p><p>PHPは処理全体を記述するプログラミング言語で、SQLはデータベースから情報を取得したり更新したりするための言語です。<\/p><p>PHPからSQLを使ってデータベースを操作することもできます。」<\/p><h2>理解確認｜3問<\/h2><p>Q1. PHPは主にどこで実行される言語ですか？<\/p>ブラウザ側サーバー側キーボード内部<p>Q2. PHPの代表的な用途はどれですか？<\/p>ログイン処理やデータベースとの連携画面の色だけを指定するパソコンの電源を供給する<p>Q3. PHPで生成したHTMLは、どこに送られますか？<\/p>ブラウザCPUのレジスタだけプリンターだけ<h2>30秒復習<\/h2><p>「先輩、最後に整理しますよ。」<\/p><ul><li><p>何の言語？ サーバー側で動くプログラミング言語。<\/p><\/li><li><p>何ができる？ ログイン処理、データベース連携、動的なページ生成など。<\/p><\/li><li><p>HTMLとの違いは？ HTMLはページの構造、PHPは主にサーバー側の処理。<\/p><\/li><li><p>JavaScriptとの違いは？ JavaScriptはブラウザでもサーバーでも実行できる。<\/p><\/li><li><p>PHPの処理は見える？ 通常、PHPのソースコードはブラウザに送られない。<\/p><\/li><li><p>代表的な用途は？ WordPressなどのWebサイト構築。<\/p><\/li><\/ul><h2>一文記憶<\/h2><p>PHPはWebサーバー側で実行され、データの処理や動的なWebページの生成を行うプログラミング言語である。<\/p><p>「先輩、PHPを理解すると、Webサイトが単に文章を表示するだけでなく、裏側でデータを処理していることが分かりますね。<\/p><p>ちなみに、GitHub PagesはPHPのサーバー側実行には対応していません。HTML・CSS・JavaScriptで動く単語帳なら公開できますが、PHPを動かすには別途対応するサーバー環境が必要なんですよ。」<\/p><\/div>", "text": "④ PHP（ピー・エイチ・ピー） 正式名称：PHP: Hypertext Preprocessor A｜要点：PHPとは何か 「先輩、PHPですね。前回までのPBRやPSRとは違って、今回はプログラミングの用語です。 PHPとは、Webサイトの裏側（サーバー側）で動くプログラミング言語のことです。 例えば、ネットショップで商品を検索したり、ログインしたり、会員情報を表示したりするときに使われます。 まずは、HTMLとの違いを覚えましょう。」 HTML： Webページの文章や構造を作る。 CSS： 色や配置など、見た目を整える。 JavaScript： 画面上の操作や動きなどを実現する。 PHP： サーバー側でデータを処理し、必要に応じてHTMLなどを生成する。 「つまりPHPは、利用者から見えない場所で仕事をする、Webサイトの裏方なんです。」 B｜詳しい解説：PHPはどう動くのか 「先輩、ログイン画面を想像してください。 IDとパスワードを入力してログインボタンを押すと、なぜ自分専用のページが表示されるのでしょう？ そこには、次のような処理があります。」 ① 利用者のブラウザ ログイン情報を送信 HTTPSでサーバーへ送信 ② Webサーバー上のPHP ログイン情報を検証する処理を実行 必要に応じてデータベースを参照 ③ データベース 利用者情報などを管理 処理結果をブラウザに返す ④ 利用者の画面 ログイン結果や専用ページを表示 「ここで重要なのは、PHPのプログラム自体は通常、利用者のブラウザに送られないということです。 サーバーでPHPが実行され、その結果としてHTMLなどが送られてくるんですよ。 ちなみに、PHPだけがサーバー側で動く言語というわけではありません。PythonやJavaScript（Node.js）なども同じような役割を担えます。」 C｜イメージ理解：レストランに例えると？ 「先輩、レストランで料理を注文する場面を想像してください。」 HTML・CSS お客さんが見るメニューや、そのデザインに相当します。 PHP 注文を受けて、厨房の中で料理を準備する役割です。 「お客さんは料理を注文しますが、厨房でどんな手順で作っているかは見えませんよね。 PHPも同じです。 利用者がボタンを押すと、サーバー側で必要な処理を行い、その結果だけを画面に返します。 ただし、JavaScriptも注文内容を確認したり、画面を切り替えたりできます。必ずPHPを通さないと動的なページが作れない、というわけではありませんよ。」 D｜具体例：PHPで何ができる？ 「では先輩、実際にPHPのコードを見てみましょう。」 PHP <?php\n$name = \"田中\";\n\necho \"こんにちは、\" . $name . \"さん！\";\n?> 「このコードをPHPが実行すると、次の文章が出力されます。」 こんにちは、田中さん！ 「 $name は変数です。名前などのデータを一時的に保存する箱だと思ってください。 そして echo は、文字列などを出力するための命令です。 ここでは変数に保存した名前を使って、表示する文章を作っているんですね。」 PHPとJavaScriptの違いを体験 「下のボタンは、JavaScriptのようなブラウザ側の動きをイメージするための例です。実際にPHPを実行しているわけではありません。」 表示する名前 こんにちは、田中さん！ この例はブラウザ上で表示内容を変更しています。PHPならサーバー側で同様の文字列を生成できます。 PHPとほかの言語との違い 技術 主な役割 HTML ページの構造 CSS ページの装飾 JavaScript 画面操作・サーバー処理 PHP サーバー側の処理 SQL データベースの操作 「先輩、PHPとSQLは特に混同しやすいので注意してください。 PHPは処理全体を記述するプログラミング言語で、SQLはデータベースから情報を取得したり更新したりするための言語です。 PHPからSQLを使ってデータベースを操作することもできます。」 理解確認｜3問 Q1. PHPは主にどこで実行される言語ですか？ ブラウザ側サーバー側キーボード内部 Q2. PHPの代表的な用途はどれですか？ ログイン処理やデータベースとの連携画面の色だけを指定するパソコンの電源を供給する Q3. PHPで生成したHTMLは、どこに送られますか？ ブラウザCPUのレジスタだけプリンターだけ 30秒復習 「先輩、最後に整理しますよ。」 何の言語？ サーバー側で動くプログラミング言語。 何ができる？ ログイン処理、データベース連携、動的なページ生成など。 HTMLとの違いは？ HTMLはページの構造、PHPは主にサーバー側の処理。 JavaScriptとの違いは？ JavaScriptはブラウザでもサーバーでも実行できる。 PHPの処理は見える？ 通常、PHPのソースコードはブラウザに送られない。 代表的な用途は？ WordPressなどのWebサイト構築。 一文記憶 PHPはWebサーバー側で実行され、データの処理や動的なWebページの生成を行うプログラミング言語である。 「先輩、PHPを理解すると、Webサイトが単に文章を表示するだけでなく、裏側でデータを処理していることが分かりますね。 ちなみに、GitHub PagesはPHPのサーバー側実行には対応していません。HTML・CSS・JavaScriptで動く単語帳なら公開できますが、PHPを動かすには別途対応するサーバー環境が必要なんですよ。」"}, {"title": "⑤ アメリカの中間選挙（Midterm Elections）", "html": "<div class=\"content\"><h1>⑤ アメリカの中間選挙（Midterm Elections）<\/h1><p>読み方：ミッドターム・イレクションズ<\/p><h2>A｜要点：中間選挙とは何か<\/h2><p>「先輩、アメリカの中間選挙ですね。<\/p><p>大統領選挙は聞いたことがありますよね。でも、中間選挙は大統領を選ぶ選挙ではないんです。<\/p><p>中間選挙とは、アメリカ大統領の4年間の任期のちょうど中間に行われる、連邦議会議員などを選ぶ選挙です。<\/p><p>これがなぜ重要なのかというと、大統領が政策を進めやすくなるか、議会に阻まれやすくなるかが変わるからなんです。<\/p><p>アメリカでは、大統領が何でも一人で決められるわけではありません。法律や予算には議会が深く関わります。<\/p><p>つまり中間選挙は、大統領の任期を変えずに、政治の進めやすさを大きく変える可能性がある選挙なんですよ。」<\/p><p>2026年のアメリカ中間選挙<\/p><h1>2026年11月3日（火）<\/h1><p>アメリカ現地時間の投票日<\/p><p>下院<\/p><h1>435議席<\/h1><p>全議席を改選<\/p><p>上院<\/p><h1>35議席<\/h1><p>通常改選33＋補欠選挙2<\/p>2026年10月26日時点の予定。州知事選挙や地方選挙も行われます。<img alt=\"Image\" class=\"exported-media\" src=\"https://www.google.com/s2/favicons?domain=https://about.usps.com&amp;sz=32\"/>about.usps.com+1<h2>B｜詳しい解説：なぜ中間選挙で政治が変わるのか<\/h2><h3>① アメリカの政治には大統領と議会がある<\/h3><p>「先輩、まずここを整理しましょう。<\/p><p>アメリカの連邦政府には、法律を執行する大統領と、法律を作る連邦議会があります。<\/p><p>そして議会は、上院と下院に分かれているんです。」<\/p><p>アメリカ連邦政府<\/p><p>大統領（行政府）<\/p><p>法律の執行・外交・行政の指揮など<\/p><p>任期4年<\/p><p>連邦議会（立法府）<\/p><p>法律・予算・行政の監視など<\/p><p>上院＋下院<\/p><p>「例えば、大統領が新しい政策を実施したいと考えたとしましょう。<\/p><p>その政策に新しい法律が必要なら、原則として上下両院の可決と大統領の署名が必要です。<\/p><p>だから議会の多数派が変わると、大統領の政策が実現する条件も変わるんですね。」<img alt=\"Image\" class=\"exported-media\" src=\"https://www.google.com/s2/favicons?domain=https://www.whitehouse.gov&amp;sz=32\"/>The White House+1<\/p><h3>② 上院と下院は何が違う？<\/h3><table><tr><th><\/th><th>上院<\/th><th>下院<\/th><\/tr><tr><td>定数<\/td><td>100人<\/td><td>435人<\/td><\/tr><tr><td>任期<\/td><td>6年<\/td><td>2年<\/td><\/tr><tr><td>選挙<\/td><td>約3分の1ずつ<\/td><td>全員<\/td><\/tr><tr><td>議席配分<\/td><td>各州2人<\/td><td>州の人口に応じる<\/td><\/tr><tr><td>特有の権限<\/td><td>多くの人事承認など<\/td><td>歳入法案の先議など<\/td><\/tr><\/table><p>「どうして上院だけ全員を一度に選ばないのか、気になりませんか？<\/p><p>上院議員の任期を6年にして、2年ごとに約3分の1ずつ選ぶことで、議会の構成が一度に全部入れ替わらない仕組みになっているんです。<\/p><p>一方、下院は2年ごとに全議席が改選されるため、比較的短い間隔で有権者の判断が議席に反映されます。」<img alt=\"Image\" class=\"exported-media\" src=\"https://www.google.com/s2/favicons?domain=https://www.usa.gov&amp;sz=32\"/>USAGov+1<\/p><h3>③ 大統領の政党が議会で負けたら？<\/h3><p>「ここが中間選挙の核心です。<\/p><p>仮に大統領の所属政党が下院の多数派を失ったとします。<\/p><p>すると、反対党が下院の審議や委員会を主導するようになります。<\/p><p>その結果、大統領が望む法案が下院で可決されにくくなったり、政権に対する調査が強まったりする可能性があります。<\/p><p>でも、大統領が辞任するわけではありません。<\/p><p>中間選挙で議会の多数派が変わっても、大統領の任期は原則として続きます。<\/p><p>これが大統領選挙との決定的な違いなんですよ。」<\/p><h2>C｜イメージ理解：会社の経営に例える<\/h2><p>「先輩、会社の社長と取締役会の関係を想像してみてください。<\/p><p>社長が『新しい工場を建設したい』と考えたとします。<\/p><p>でも、その投資に取締役会の承認が必要なら、社長一人の判断では進められませんよね。」<\/p><img alt=\"Cash leadership office for Bristol Myers Squibb | EY - US\" class=\"exported-media\" src=\"https://images.openai.com/static-rsc-4/VrPMD0O8uwG2U-tiWDTA0a2Y-VM2IgQCwDuvX1XD0NF2t6ZDr1b3Y4bKmtc6txNSIK6te_zih6wNLM1xftXZyWWogwRNJiNfgxbwXYOUb5J-ZUlBCM95XCbgRubqZWvmdoyMQ3AwAeRjCTWfVS_9gW2DpkgVt01Nvit_lzdsK0w?purpose=inline\"/><p>大統領のイメージ<\/p><p>政策を提案し、行政を動かす立場です。<\/p><img alt=\"How To Present Updates To C-Suite Members - Work It Daily\" class=\"exported-media\" src=\"https://images.openai.com/static-rsc-4/d8aXJMLCZ47boJFWbeRQjM1HBkKOtE6iDkt-uizG6UEccLbW3ZLf5O9aScAPm-kEOG_pCxyiUdvnNyLpwDto0A9Mfs1uaUTVvfjOh7EXxQlYHmAg9QAqpn4u1hULMCIlog0D0UiSHBWiUIORCaEB0bW2v4lEzJBO2_UEBocDT0s?purpose=inline\"/><p>議会のイメージ<\/p><p>法律や予算を審議し、行政を監視する立場です。<\/p><p>「中間選挙は、この取締役会の構成員を選び直すようなイメージです。<\/p><p>社長の方針に賛成する人が多ければ、提案は進みやすくなるかもしれません。<\/p><p>反対する人が多ければ、修正や交渉が必要になるでしょう。<\/p><p>ただし、これは役割を理解するための例えです。実際のアメリカ議会は、会社の取締役会とは異なる憲法上の独立した権限を持っています。」<\/p><h2>D｜具体例：2026年の中間選挙<\/h2><p>「では先輩、2026年の中間選挙を具体的に考えましょう。<\/p><p>2026年10月26日現在、アメリカの大統領は共和党のドナルド・トランプ氏です。<\/p><p>今回の中間選挙では、共和党と民主党のどちらが上下両院の多数派を確保するかが重要な焦点になります。」<\/p><h3>選挙結果によって何が変わる？<\/h3><p>仮に選挙後の議会が次の構成になった場合<\/p><p>ケース① 共和党が上下両院で多数派<\/p><p>大統領と議会多数派が同じ政党になるため、政権の法案や人事を進めるうえで協力を得やすい構成です。ただし党内の意見の違いもあります。<\/p><p>ケース② 民主党が下院で多数派<\/p><p>民主党が下院の審議や委員会を主導し、政権への監視を強めたり、法案の修正を求めたりできる構成です。<\/p><p>ケース③ 民主党が上下両院で多数派<\/p><p>民主党が議会の両院を主導します。ただし、法律の成立には大統領の署名や拒否権への対応が必要です。<\/p>いずれも仕組みを理解するための仮定であり、選挙結果の予測ではありません。<img alt=\"Image\" class=\"exported-media\" src=\"https://www.google.com/s2/favicons?domain=https://www.reuters.com&amp;sz=32\"/>reuters.com+1<h3>なぜ日本の経済や株式市場にも関係するのか？<\/h3><p>「先輩、アメリカの政治が変わると、日本にも影響が及ぶことがあります。<\/p><p>例えば、関税政策、政府支出、税制、エネルギー政策などです。<\/p><p>中間選挙で議会構成が変わると、こうした政策の実現可能性や内容が変化する場合があります。<\/p><p>すると、企業の将来利益への見通しが変わり、株価や為替市場にも影響する可能性があるんです。<\/p><p>ただし、中間選挙でどちらの政党が議席を増やせば株価が上がる、と単純には決められません。 経済状況や金融政策、投資家の予想なども影響します。」<\/p><h2>理解確認｜3問<\/h2><p>Q1. アメリカの中間選挙では、通常何を選びますか？<\/p>大統領連邦議会議員など最高裁判所の判事全員<p>Q2. 中間選挙で大統領の政党が下院の多数派を失うと、どうなりますか？<\/p>大統領は自動的に辞任する大統領の任期が延長される議会で政策を進めるための交渉が難しくなる場合がある<p>Q3. アメリカの下院議員の任期は何年ですか？<\/p>2年4年6年<h2>30秒復習<\/h2><p>「先輩、最後に6つのポイントを整理しますよ。」<\/p><ol><li><p>何の選挙？ 大統領任期の中間に行われる連邦議会議員などの選挙。<\/p><\/li><li><p>いつ行う？ 大統領選挙の2年後。次回は2026年11月3日。<\/p><\/li><li><p>下院は？ 435議席すべてを改選。<\/p><\/li><li><p>上院は？ 約3分の1を改選。2026年は補欠選挙を含む35議席。<\/p><\/li><li><p>なぜ重要？ 議会の多数派が変わると、大統領の政策の進めやすさが変わる。<\/p><\/li><li><p>注意点は？ 中間選挙では大統領そのものを選び直さない。<\/p><\/li><\/ol><h2>一文記憶<\/h2><p>アメリカの中間選挙は、大統領の任期途中に議会の構成を選び直し、その後の政策運営に大きな影響を与える選挙である。<\/p><p>「先輩、ニュースで『共和党が下院の多数派を維持するか』『民主党が上院で議席を増やすか』という話が出てきたら、今回の仕組みを思い出してください。<\/p><p>重要なのは、単にどちらが何議席取ったかではなく、その結果によって法律・予算・人事・政権監視の仕組みがどう変わるかなんですよ。」<\/p><\/div>", "text": "⑤ アメリカの中間選挙（Midterm Elections） 読み方：ミッドターム・イレクションズ A｜要点：中間選挙とは何か 「先輩、アメリカの中間選挙ですね。 大統領選挙は聞いたことがありますよね。でも、中間選挙は大統領を選ぶ選挙ではないんです。 中間選挙とは、アメリカ大統領の4年間の任期のちょうど中間に行われる、連邦議会議員などを選ぶ選挙です。 これがなぜ重要なのかというと、大統領が政策を進めやすくなるか、議会に阻まれやすくなるかが変わるからなんです。 アメリカでは、大統領が何でも一人で決められるわけではありません。法律や予算には議会が深く関わります。 つまり中間選挙は、大統領の任期を変えずに、政治の進めやすさを大きく変える可能性がある選挙なんですよ。」 2026年のアメリカ中間選挙 2026年11月3日（火） アメリカ現地時間の投票日 下院 435議席 全議席を改選 上院 35議席 通常改選33＋補欠選挙2 2026年10月26日時点の予定。州知事選挙や地方選挙も行われます。 about.usps.com+1 B｜詳しい解説：なぜ中間選挙で政治が変わるのか ① アメリカの政治には大統領と議会がある 「先輩、まずここを整理しましょう。 アメリカの連邦政府には、法律を執行する大統領と、法律を作る連邦議会があります。 そして議会は、上院と下院に分かれているんです。」 アメリカ連邦政府 大統領（行政府） 法律の執行・外交・行政の指揮など 任期4年 連邦議会（立法府） 法律・予算・行政の監視など 上院＋下院 「例えば、大統領が新しい政策を実施したいと考えたとしましょう。 その政策に新しい法律が必要なら、原則として上下両院の可決と大統領の署名が必要です。 だから議会の多数派が変わると、大統領の政策が実現する条件も変わるんですね。」 The White House+1 ② 上院と下院は何が違う？ 上院 下院 定数 100人 435人 任期 6年 2年 選挙 約3分の1ずつ 全員 議席配分 各州2人 州の人口に応じる 特有の権限 多くの人事承認など 歳入法案の先議など 「どうして上院だけ全員を一度に選ばないのか、気になりませんか？ 上院議員の任期を6年にして、2年ごとに約3分の1ずつ選ぶことで、議会の構成が一度に全部入れ替わらない仕組みになっているんです。 一方、下院は2年ごとに全議席が改選されるため、比較的短い間隔で有権者の判断が議席に反映されます。」 USAGov+1 ③ 大統領の政党が議会で負けたら？ 「ここが中間選挙の核心です。 仮に大統領の所属政党が下院の多数派を失ったとします。 すると、反対党が下院の審議や委員会を主導するようになります。 その結果、大統領が望む法案が下院で可決されにくくなったり、政権に対する調査が強まったりする可能性があります。 でも、大統領が辞任するわけではありません。 中間選挙で議会の多数派が変わっても、大統領の任期は原則として続きます。 これが大統領選挙との決定的な違いなんですよ。」 C｜イメージ理解：会社の経営に例える 「先輩、会社の社長と取締役会の関係を想像してみてください。 社長が『新しい工場を建設したい』と考えたとします。 でも、その投資に取締役会の承認が必要なら、社長一人の判断では進められませんよね。」 大統領のイメージ 政策を提案し、行政を動かす立場です。 議会のイメージ 法律や予算を審議し、行政を監視する立場です。 「中間選挙は、この取締役会の構成員を選び直すようなイメージです。 社長の方針に賛成する人が多ければ、提案は進みやすくなるかもしれません。 反対する人が多ければ、修正や交渉が必要になるでしょう。 ただし、これは役割を理解するための例えです。実際のアメリカ議会は、会社の取締役会とは異なる憲法上の独立した権限を持っています。」 D｜具体例：2026年の中間選挙 「では先輩、2026年の中間選挙を具体的に考えましょう。 2026年10月26日現在、アメリカの大統領は共和党のドナルド・トランプ氏です。 今回の中間選挙では、共和党と民主党のどちらが上下両院の多数派を確保するかが重要な焦点になります。」 選挙結果によって何が変わる？ 仮に選挙後の議会が次の構成になった場合 ケース① 共和党が上下両院で多数派 大統領と議会多数派が同じ政党になるため、政権の法案や人事を進めるうえで協力を得やすい構成です。ただし党内の意見の違いもあります。 ケース② 民主党が下院で多数派 民主党が下院の審議や委員会を主導し、政権への監視を強めたり、法案の修正を求めたりできる構成です。 ケース③ 民主党が上下両院で多数派 民主党が議会の両院を主導します。ただし、法律の成立には大統領の署名や拒否権への対応が必要です。 いずれも仕組みを理解するための仮定であり、選挙結果の予測ではありません。 reuters.com+1 なぜ日本の経済や株式市場にも関係するのか？ 「先輩、アメリカの政治が変わると、日本にも影響が及ぶことがあります。 例えば、関税政策、政府支出、税制、エネルギー政策などです。 中間選挙で議会構成が変わると、こうした政策の実現可能性や内容が変化する場合があります。 すると、企業の将来利益への見通しが変わり、株価や為替市場にも影響する可能性があるんです。 ただし、中間選挙でどちらの政党が議席を増やせば株価が上がる、と単純には決められません。 経済状況や金融政策、投資家の予想なども影響します。」 理解確認｜3問 Q1. アメ てみましょう<\/h3>時間の区分アメリカの都市ニューヨークロサンゼルスシカゴ<p>アメリカ現地の時刻<\/p><h2>09:00<\/h2><p>ニューヨーク<\/p><h1>09:00<\/h1><p>現地時間<\/p><p>日本<\/p><h1>22:00<\/h1><p>同日・時差＋13時間<\/p>現地時刻から日本時刻への換算例です。切替日の重複・欠落する時刻は考慮していません。<h3>2026年の切替日<\/h3><p>3月8日（日）<\/p><p>サマータイム開始<\/p><p>11月1日（日）<\/p><p>サマータイム終了<\/p>アメリカのサマータイム実施地域における現地日付です。<img alt=\"Image\" class=\"exported-media\" src=\"https://www.google.com/s2/favicons?domain=https://www.nist.gov&amp;sz=32\"/>NIST+1<p>「つまり、2026年10月26日現在は、アメリカの多くの地域でまだサマータイム中です。<\/p><p>11月1日に通常時間へ戻るので、ニューヨークと日本の時差は13時間から14時間に変わります。<\/p><p>アメリカ株を取引する場合、米国市場の通常取引開始時刻は、夏時間なら日本時間22時30分、冬時間なら23時30分になります。米国市場の休場日や短縮取引日は別途確認してくださいね。」<\/p><h2>理解確認｜3問<\/h2><p>Q1. サマータイムでは時計をどう変更しますか？<\/p>1時間進める1時間戻す2時間進める<p>Q2. サマータイムによって何が変わりますか？<\/p>太陽の動く速さ地球の自転速度時計上の日の出・日の入り時刻<p>Q3. ニューヨークがサマータイム中の午前9時なら、日本は何時ですか？<\/p>午後8時午後10時午後11時<h2>30秒復習<\/h2><p>「先輩、最後に整理しますよ。」<\/p><ul><li><p>サマータイムとは？ 時計を通常より1時間進める制度。<\/p><\/li><li><p>目的は？ 夕方の明るい時間を有効活用することなど。<\/p><\/li><li><p>開始時は？ 時計を1時間進める。<\/p><\/li><li><p>終了時は？ 時計を1時間戻す。<\/p><\/li><li><p>アメリカの2026年の実施期間は？ 3月8日から11月1日まで。<\/p><\/li><li><p>日本との関係は？ アメリカとの時差が季節によって1時間変わる。<\/p><\/li><\/ul><h2>一文記憶<\/h2><p>サマータイムは、夏を中心とする季節に時計を1時間進め、夕方の明るい時間を活用するための制度である。<\/p><p>「先輩、覚え方は英語の Spring forward, fall back です。<\/p><p>春は時計を前へ、秋は後ろへ。<\/p><p>これを覚えておけば、海外ニュースやアメリカ株の取引時間を確認するときにも役立ちますよ。」<\/p><\/div>", "text": "⑥ サマータイム（Daylight Saving Time） 英語：Daylight Saving Time（デイライト・セービング・タイム）／略称：DST A｜要点：サマータイムとは何か 「先輩、サマータイムですね。 これはアメリカのニュースや海外の株式市場を見るときにも重要な仕組みです。 サマータイムとは、日照時間が長い季節に、時計を通常より1時間進める制度のことです。 ただし、太陽が出る時間そのものを変えるわけではありませんよ。人間が使う時計の時刻を変えるんです。」 通常時間 7:00 サマータイム 8:00 同じ瞬間でも、サマータイムの時計は通常より1時間進んでいます。 「例えば、通常時間で朝7時に太陽が昇るとします。 サマータイムにすると、同じ日の出が時計上では朝8時になります。 その代わり、日の入りも時計上では1時間遅くなるので、仕事や学校が終わった後に明るい時間を長く使いやすくなるんです。 ここまで大丈夫ですか、先輩？」 B｜詳しい解説：なぜサマータイムを導入するのか ① 日照時間と生活時間のずれ 「先輩、夏は冬より日が長いですよね。 例えば、通常時間で夏の日の出が朝5時、日の入りが夜7時だったとします。 でも、多くの人が朝8時から活動するとしたら、早朝の明るい時間を十分に使えていないかもしれません。 そこで時計を1時間進めると、日の出は時計上で朝6時、日の入りは夜8時になります。 活動する時間帯を、明るい時間帯に近づけようという考え方なんです。」 同じ日の太陽の動きを比較 説明用の仮定。黄色が日照時間です。太陽の動きは同じで、時計の表示だけが変わります。 ② 何のために導入するの？ 「主な目的としては、夕方の明るい時間を活用することや、照明に使う電力の削減などが挙げられます。 ただし、先輩。サマータイムが必ず省エネルギーにつながるとは限りません。 照明の電力が減っても、冷房などの使用が増える可能性があります。 さらに、時計の変更によって睡眠や生活リズムが乱れるという問題もあるんです。」 ③ 時計はいつ変更するの？ 「アメリカの多くの地域では、次のルールになっています。」 開始：3月の第2日曜日、午前2時を午前3時に進める。 終了：11月の第1日曜日、午前2時を午前1時に戻す。 「開始時には時計が1時間飛ぶので、その夜は時計上の時間が1時間短くなります。 反対に、終了時には午前1時台が2回現れます。 なお、アメリカでもハワイ州やアリゾナ州の大部分など、サマータイムを採用していない地域があります。 日本は現在、サマータイムを実施していません。」 D｜具体例：日本とアメリカの時差 「先輩、ここは実生活でも役立ちますよ。 日本ではサマータイムを実施していないので、アメリカ側の時計が変わると、日本との時差も1時間変化します。」 都市 サマータイム中 通常時間 ニューヨーク 日本が13時間先 日本が14時間先 ロサンゼルス 日本が16時間先 日本が17時間先 シカゴ 日本が14時間先 日本が15時間先 「例えば、ニューヨークが午前9時なら、日本はサマータイム中は午後10時、通常時間では午後11時です。」 時差を実際に切り替えてみましょう 時間の区分アメリカの都市ニューヨークロサンゼルスシカゴ アメリカ現地の時刻 09:00 ニューヨーク 09:00 現地時間 日本 22:00 同日・時差＋13時間 現地時刻から日本時刻への換算例です。切替日の重複・欠落する時刻は考慮していません。 2026年の切替日 3月8日（日） サマータイム開始 11月1日（日） サマータイム終了 アメリカのサマータイム実施地域における現地日付です。 NIST+1 「つまり、2026年10月26日現在は、アメリカの多くの地域でまだサマータイム中です。 11月1日に通常時間へ戻るので、ニューヨークと日本の時差は13時間から14時間に変わります。 アメリカ株を取引する場合、米国市場の通常取引開始時刻は、夏時間なら日本時間22時30分、冬時間なら23時30分になります。米国市場の休場日や短縮取引日は別途確認してくださいね。」 理解確認｜3問 Q1. サマータイムでは時計をどう変更しますか？ 1時間進める1時間戻す2時間進める Q2. サマータイムによって何が変わりますか？ 太陽の動く速さ地球の自転速度時計上の日の出・日の入り時刻 Q3. ニューヨークがサマータイム中の午前9時なら、日本は何時ですか？ 午後8時午後10時午後11時 30秒復習 「先輩、最後に整理しますよ。」 サマータイムとは？ 時計を通常より1時間進める制度。 目的は？ 夕方の明るい時間を有効活用することなど。 開始時は？ 時計を1時間進める。 終了時は？ 時計を1時間戻す。 アメリカの2026年の実施期間は？ 3月8日から11月1日まで。 日本との関係は？ アメリカとの時差が季節によって1時間変わる。 一文記憶 サマータイムは、夏を中心とする季節に時計を1時間進め、夕方の明るい時間を活用するための制度である。 「先輩、覚え方は英語の Spring forward, fall back です。 春は時計を前へ、秋は後ろへ。 これを覚えておけば、海外ニュースやアメリカ株の取引時間を確認するときにも役立ちますよ。」"}, {"title": "⑦ 関税（かんぜい）", "html": "<div class=\"content\"><h1>⑦ 関税（かんぜい）<\/h1><p>英語：Tariff（タリフ）／Customs Duty（カスタムズ・デューティー）<\/p><h2>A｜要点：関税とは何か<\/h2><p>「先輩、関税ですね。アメリカの経済ニュースを理解するうえでも、ぜひ押さえておきたい言葉です。<\/p><p>まず質問です。<\/p><p>アメリカが日本製の自動車に25%の関税をかけると聞いたら、誰がその25%を支払うと思いますか？<\/p><p>日本の自動車メーカーでしょうか。それともアメリカの消費者でしょうか？<\/p><p>実は、原則として、関税を税関に納めるのは輸入する側の事業者なんです。<\/p><p>そして、その負担の一部が商品の値上げを通じて消費者に転嫁されることがあります。」<\/p><p>関税とは、外国から輸入する商品に対して、輸入国が課す税金のことです。<\/p><p>例： るでしょう？」<\/p><img alt=\"USFans: #1 Taobao/1688/Weidian Agent | Global Shipping from China\" class=\"exported-media\" src=\"https://images.openai.com/static-rsc-4/cqYubDITzk-MmC7S2EouC045DE2WbEAKAV-KgBHcVsZ9_AcXq_M6_WWeoipL8ZGtFQL4Gm8PdeYd5fX6_2A3qKy0SGukK6hP9dLYU1AQ3w5pz6bFA6XQRO4KY276JVX_vEvni4A-XyJpd0Oca_7VwGjU59NDfOUKIJs-kRLIIjM?purpose=inline\"/><p>関税なし<\/p><h2>10,000円<\/h2><p>外国製品を比較的安く購入できます。<\/p><img alt=\"トライアルのアパレル専門店「リアルト」都市部で出店加速へ 西友の店舗網を活用\" class=\"exported-media\" src=\"https://images.openai.com/static-rsc-4/GjESXG8vZTPNJTvvT-MEQGKBCNfhznupd9VhbvS6_Tf0CvtSlY1aQRTCF_G6nf73VCQwaz_gwUo3EGrQUGPeY1Huj5BEQQyclACob8Z5Al0lGpza2xEb4zjGZJ51o1ANTPHN5SZyl7TASqGNqIFIXF7O4ifBitFRY5RSQQ2QC28?purpose=inline\"/><p>関税20%<\/p><h2>12,000円<\/h2><p>関税分がすべて販売価格に転嫁された場合の例です。<\/p><p>「関税によって外国製の靴が値上がりすると、国内製の靴を選ぶ消費者が増えるかもしれません。<\/p><p>国内の靴メーカーには追い風ですね。<\/p><p>でも、消費者は靴を買うために、より多くのお金を払うことになるかもしれません。<\/p><p>さらに、外国製の材料を使って靴を製造している国内企業にとっては、材料費が上がる可能性もあります。<\/p><p>つまり、関税は国内企業を一律に助ける政策ではないんです。」<\/p><h3>経済全体への影響<\/h3><p>「経済学では、関税によって輸入品の国内価格が上がると、一般的に次のような変化が起こると考えます。」<\/p>DemandSupplyWorld pricePrice with tariffTariff revenueDeadweight lossTariff 1: price rises, imports are 7.5, revenue is 7.5; consumers lose, producers gainTariffper unitTariff<p>「この図では、世界市場で決まる価格を一定とする小国モデルを考えています。<\/p><p>関税によって国内価格が上昇すると、国内企業の生産量は増え、国内消費量は減り、輸入量は減少します。<\/p><p>政府は関税収入を得ますが、消費者の負担増のすべてが国内企業や政府の利益になるわけではありません。<\/p><p>その差の一部が、**死荷重（しかじゅう）**と呼ばれる経済的な損失になるんです。<\/p><p>ただし、これは基本的な経済モデルであり、大国が関税をかけた場合や、相手国が報復した場合には、さらに複雑な影響が生じます。」<\/p><h2>D｜具体例：25%の関税を計算する<\/h2><p>「では先輩、実際に関税率を動かしてみましょう。<\/p><p>外国から100万円の商品を輸入する場合を考えます。」<\/p><p>商品の課税対象額<\/p><h2>100万円<\/h2><p>関税率<\/p><h2>25%<\/h2><p>関税額<\/p><h1>25万円<\/h1><p>100万円 × 25%<\/p><p>課税対象額<\/p><p>100万円<\/p><p>関税<\/p><p>25万円<\/p><p>合計<\/p><h2>125万円<\/h2><p>商品価格<\/p><p>関税<\/p>従価税の単純計算です。実際には課税価格の算定方法、免税措置、消費税、輸送費などによって総費用が変わります。<p>「初期値では100万円の商品に25%の関税がかかるので、関税は25万円。輸入業者は商品代金と関税で125万円を負担する計算ですね。<\/p><p>ただし、その125万円がそのまま消費者への販売価格になるわけではありません。<\/p><p>輸入業者の利益率、流通費用、外国メーカーの価格調整などによって変わります。」<\/p><h2>関税と似た用語の違い<\/h2><table><tr><th>用語<\/th><th>意味<\/th><\/tr><tr><td>関税<\/td><td>主に輸入品に課される税金<\/td><\/tr><tr><td>輸入関税<\/td><td>外国から入る商品にかける関税<\/td><\/tr><tr><td>報復関税<\/td><td>相手国の貿易措置に対抗して課す関税<\/td><\/tr><tr><td>保護貿易<\/td><td>国内産業を守るために貿易を制限する政策<\/td><\/tr><tr><td>自由貿易<\/td><td>関税などの貿易障壁を減らす考え方<\/td><\/tr><tr><td>非関税障壁<\/td><td>関税以外の貿易を妨げる規制や制度など<\/td><\/tr><\/table><p>「先輩、特に『関税』と『保護貿易』を混同しないでください。<\/p><p>関税は具体的な税金で、保護貿易は国内産業を保護するための政策的な考え方です。<\/p><p>関税は保護貿易の手段の一つなんですよ。」<\/p><h2>理解確認｜3問<\/h2><p>Q1. アメリカが日本製品に関税をかけた場合、原則として誰がアメリカの税関に納付しますか？<\/p>日本政府アメリカの輸入業者アメリカの消費者が直接納付する<p>Q2. 関税によって輸入品の価格が上昇すると、一般的にどうなりますか？<\/p>輸入量が減りやすくなる輸入量が必ず増える国内製品の価格は必ず下がる<p>Q3. 100万円の商品に20%の関税がかかった場合、関税額はいくらですか？<\/p>2万円20万円120万円<h2>30秒復習<\/h2><p>「先輩、最後に重要なポイントを整理しますよ。」<\/p><ul><li><p>関税とは？ 外国から輸入する商品に課される税金。<\/p><\/li><li><p>誰が納める？ 原則として輸入業者。<\/p><\/li><li><p>目的は？ 国内産業の保護、税収確保、貿易交渉など。<\/p><\/li><li><p>輸入品の価格は？ 上昇しやすくなる。<\/p><\/li><li><p>国内企業への影響は？ 保護される企業もあれば、原材料費が上がる企業もある。<\/p><\/li><li><p>消費者への影響は？ 商品価格の上昇などで負担が増える可能性がある。<\/p><\/li><li><p>注意点は？ 関税を納める人と、実際に負担する人は必ずしも同じではない。<\/p><\/li><\/ul><h2>一文記憶<\/h2><p>関税は輸入品に課される税金で、国内産業の保護などに使われる一方、輸入コストや消費者価格を上昇させる可能性がある。<\/p><p>「先輩、関税のニュースを見るときは、単に『何%の関税がかかったか』だけではなく、誰が納めるのか、誰が負担するのか、誰が利益を得るのかを分けて考えてください。<\/p><p>この3つを意識できれば、貿易政策が企業の利益や物価にどう影響するか、ずっと理解しやすくなりますよ。」<\/p><\/div>", "text": "⑦ 関税（かんぜい） 英語：Tariff（タリフ）／Customs Duty（カスタムズ・デューティー） A｜要点：関税とは何か 「先輩、関税ですね。アメリカの経済ニュースを理解するうえでも、ぜひ押さえておきたい言葉です。 まず質問です。 アメリカが日本製の自動車に25%の関税をかけると聞いたら、誰がその25%を支払うと思いますか？ 日本の自動車メーカーでしょうか。それともアメリカの消費者でしょうか？ 実は、原則として、関税を税関に納めるのは輸入する側の事業者なんです。 そして、その負担の一部が商品の値上げを通じて消費者に転嫁されることがあります。」 関税とは、外国から輸入する商品に対して、輸入国が課す税金のことです。 例：日本からアメリカへ自動車を輸出 関税の基本的な納付の流れ。最終的な経済的負担は、輸入業者・輸出企業・消費者などに分かれる場合があります。 「ここで覚えてほしいのは、税金を政府に納める人と、実際に経済的な負担をする人は同じとは限らないという点です。 この違いを理解すると、関税のニュースがぐっと読みやすくなりますよ。」 B｜詳しい解説：なぜ関税をかけるのか ① 国内産業を保護するため 「先輩、アメリカに国内メーカーA社と、外国メーカーB社があるとします。 どちらも同じような商品を販売していますが、B社のほうが安く製造できるとしましょう。 このとき、アメリカ政府が外国製品に関税をかけると、どうなるでしょうか？」 外国製品に関税をかける 輸入する際のコストが上がる 外国製品の国内販売価格が上がりやすくなる 国内製品が価格面で競争しやすくなる 「つまり、関税によって国内企業を外国企業との価格競争から保護しようとするわけです。 ただし、先輩。国内企業にとって有利でも、消費者にとって有利とは限りません。 輸入品が値上がりすれば、消費者は以前より高い価格で商品を購入することになるかもしれませんからね。」 ② 政府の税収を増やすため 「関税は税金ですから、政府にとって収入になります。 例えば、課税対象額が1,000億円の輸入品に10%の関税をかけ、輸入量や価格などが変わらなかったと仮定すると、関税収入は100億円になります。 でも、関税によって輸入量が減ると、税収も想定より少なくなる可能性があります。」 ③ 貿易交渉の手段として使うため 「関税は、外国との交渉でも使われます。 例えば、A国がB国の商品に高い関税をかけると、B国は自国の輸出企業への影響を懸念するかもしれません。 その結果、両国が関税の引き下げや市場開放について交渉することがあります。 ただし、相手国が報復関税をかけることもあります。 そうなると、両国の貿易が縮小したり、企業のコストが増えたりする可能性があるんです。」 C｜イメージ理解：関税で誰が得をして、誰が負担するのか 「先輩、外国製の靴が1万円で売られているとしましょう。 そこに20%の関税がかかったら、どうなるでしょう？」 関税なし 10,000円 外国製品を比較的安く購入できます。 関税20% 12,000円 関税分がすべて販売価格に転嫁された場合の例です。 「関税によって外国製の靴が値上がりすると、国内製の靴を選ぶ消費者が増えるかもしれません。 国内の靴メーカーには追い風ですね。 でも、消費者は靴を買うために、より多くのお金を払うことになるかもしれません。 さらに、外国製の材料を使って靴を製造している国内企業にとっては、材料費が上がる可能性もあります。 つまり、関税は国内企業を一律に助ける政策ではないんです。」 経済全体への影響 「経済学では、関税によって輸入品の国内価格が上がると、一般的に次のような変化が起こると考えます。」 DemandSupplyWorld pricePrice with tariffTariff revenueDeadweight lossTariff 1: price rises, imports are 7.5, revenue is 7.5; consumers lose, producers gainTariffper unitTariff 「この図では、世界市場で決まる価格を一定とする小国モデルを考えています。 関税によって国内価格が上昇すると、国内企業の生産量は増え、国内消費量は減り、輸入量は減少します。 政府は関税収入を得ますが、消費者の負担増のすべてが国内企業や政府の利益になるわけではありません。 その差の一部が、**死荷重（しかじゅう）**と呼ばれる経済的な損失になるんです。 ただし、これは基本的な経済モデルであり、大国が関税をかけた場合や、相手国が報復した場合には、さらに複雑な影響が生じます。」 D｜具体例：25%の関税を計算する 「では先輩、実際に関税率を動かしてみましょう。 外国から100万円の商品を輸入する場合を考えます。」 商品の課税対象額 100万円 関税率 25% 関税額 25万円 100万円 × 25% 課税対象額 100万円 関税 25万円 合計 125万円 商品価格 関税 従価税の単純計算です。実際には課税価格の算定方法、免税措置、消費税、輸送費などによって総費用が変わります。 「初期値では100万円の商品に25%の関税がかかるので、関税は25万円。輸入業者は商品代金と関税で125万円を負担する計算ですね。 ただし、その125万円がそのまま消費者への販売価格になるわけではありません。 輸入業者の利益率、流通費用、外国メーカーの価格調整などによって変わります。」 関税と似た用語の違い 用語 意味 関税 主に輸入品に課される税金 輸入関税 外国から入る商品にかける関税 報復関税 相手国の貿易措置に対抗して課す関税 保護貿易 国内産業を守るために貿易を制限する政策 自由貿易 関税などの貿易障壁を減らす考え方 非関税障壁 関税以外の貿易を妨げる規制や制度など 「先輩、特に『関税』と『保護貿易』を混同しないでください。 関税は具体的な税金で、保護貿易は国内産業を保護するための政策的な考え方です。 関税は保護貿易の手段の一つなんですよ。」 理解確認｜3問 Q1. アメリカが日本製品に関税をかけた場合、原則として誰がアメリカの税関に納付しますか？ 日本政府アメリカの輸入業者アメリカの消費者が直接納付する Q2. 関税によって輸入品の価格が上昇すると、一般的にどうなりますか？ 輸入量が減りやすくなる輸入量が必ず増える国内製品の価格は必ず下がる Q3. 100万円の商品に20%の関税がかかった場合、関税額はいくらですか？ 2万円20万円120万円 30秒復習 「先輩、最後に重要なポイントを整理しますよ。」 関税とは？ 外国から輸入する商品に課される税金。 誰が納める？ 原則として輸入業者。 目的は？ 国内産業の保護、税収確保、貿易交渉など。 輸入品の価格は？ 上昇しやすくなる。 国内企業への影響は？ 保護される企業もあれば、原材料費が上がる企業もある。 消費者への影響は？ 商品価格の上昇などで負担が増える可能性がある。 注意点は？ 関税を納める人と、実際に負担する人は必ずしも同じではない。 一文記憶 関税は輸入品に課される税金で、国内産業の保護などに使われる一方、輸入コストや消費者価格を上昇させる可能性がある。 「先輩、関税のニュースを見るときは、単に『何%の関税がかかったか』だけではなく、誰が納めるのか、誰が負担するのか、誰が利益を得るのかを分けて考えてください。 この3つを意識できれば、貿易政策が企業の利益や物価にどう影響するか、ずっと理解しやすくなりますよ。」"}, {"title": "⑧ 長期金利と短期金利", "html": "<div class=\"content\"><h1>⑧ 長期金利と短期金利<\/h1><p>英語：Long-term Interest Rate（長期金利）／Short-term Interest Rate（短期金利）<\/p><h2>A｜要点：長期金利と短期金利は何が違う？<\/h2><p>「先輩、今回は経済ニュースを理解するうえで、とても重要な2つの金利です。<\/p><p>まず質問です。<\/p><p>銀行から1週間だけお金を借りる場合と、10年間借りる場合では、同じ金利になると思いますか？<\/p><p>普通は違いますよね。<\/p><p>短期金利と長期金利の基本的な違いは、お金を貸し借りする期間の長さなんです。」<\/p><p>短期金利<\/p><h2>1年未満<\/h2><p>短い期間のお金の貸し借りに関する金利<\/p><p>長期金利<\/p><h2>1年以上<\/h2><p>長い期間のお金の貸し借りに関する金利<\/p><p>日本の経済ニュースでは、短期金利は日銀の政策金利、長期金利は10年物国債の利回りを代表的な指標として扱うことが多いです。<\/p><p>「ここで先輩に覚えてほしいのは、次の違いです。<\/p><p>短期金利は中央銀行の政策の影響を直接受けやすく、長期金利は将来の金利・物価・経済の見通しなどを反映しやすい。<\/p><p>これが今回の中心になります。」<\/p><h2>B｜詳しい解説：金利はどうやって決まる？<\/h2><h3>① 短期金利はなぜ日銀が動かせるのか<\/h3><p>「先輩、日本銀行は日本の中央銀行ですよね。<\/p><p>日銀は物価の安定などを目的に金融政策を行っています。<\/p><p>その代表的な手段が、短期金利に働きかけることなんです。<\/p><p>例えば、物価が上昇しすぎているとき、日銀が政策金利を引き上げたとしましょう。」<\/p><p>① 日銀が政策金利を引き上げる<\/p><p>② 銀行の短期的な資金調達金利などが上がる<\/p><p>③ 企業や家計の借入金利にも波及する<\/p><p>④ 設備投資や消費が抑制されやすくなる<\/p><p>⑤ 物価上昇を抑える方向に働く<\/p><p>「ただし、金利を上げた瞬間に物価が下がるわけではありません。<\/p><p>企業の投資計画や家計の支出が変化するまでには時間がかかりますし、為替や海外経済などの影響も受けます。」<\/p><h3>② 金融政策が経済に伝わる仕組み<\/h3><p>「先輩、金利の引き下げと引き上げが、経済全体にどう影響するかも確認してみましょう。」<\/p>Demand (MD / AD)Supply (MS / SRAS)Long-run supply (LRAS)Money marketAD–ASMoney ↓→Rate ↑→Investment ↓→AD ↓Less money raises the interest rate to 6.1, lowers investment, and shifts AD leftPolicy typeExpansionaryContractionaryPolicy strengthPolicy strength<p>「これは金融引き締めと金融緩和の基本的なモデルです。<\/p><p>引き締めによって金利が上がると、設備投資などが減少し、総需要を抑える方向に働きます。<\/p><p>反対に緩和によって金利が下がると、投資や需要を刺激する方向に働きます。<\/p><p>ただし、実際の日銀は政策金利や資金供給など複数の手段を用いますから、図は基本的な仕組みを示したものですよ。」<\/p><h3>③ 長期金利はなぜ市場で決まるのか<\/h3><p>「では先輩、10年物国債の利回りは、どうやって決まるのでしょう？<\/p><p>基本的には、債券市場での売買を通じて決まります。<\/p><p>例えば、投資家が『これから物価が上昇し、日銀も金利を引き上げるだろう』と予想したとします。<\/p><p>すると、今の低い利回りの国債を買う魅力が小さくなるかもしれません。<\/p><p>国債が売られて価格が下がると、利回りは上昇します。」<\/p><p>固定利付国債の価格と利回り<\/p><p>国債価格が上昇<\/p><p>利回りは低下<\/p><p>国債価格が下落<\/p><p>利回りは上昇<\/p><p>「ここは大切ですよ。<\/p><p>国債価格と利回りは、基本的に反対方向に動くんです。<\/p><p>長期金利は、将来の短期金利の予想に加えて、物価上昇への見通しや、長期間資金を貸すことへの上乗せ利回りなどの影響を受けます。<\/p><p>だから日銀が短期金利を引き上げても、長期金利が必ず同じ幅だけ上がるとは限りません。」<\/p><h2>C｜イメージ理解：短期と長期の貸し借り<\/h2><p>「先輩、友人にお金を貸す場面を想像してください。」<\/p><img alt=\"Thank you for lending me the money\" class=\"exported-media\" src=\"https://images.openai.com/static-rsc-4/tEx5kQDK-dyzzHTLUyc4NvxqgIxCs9R9aH4Eh_GjcrEvrZNAC3W-ZFzVgkjUR9jNbrHnUXLQgdHaIkJoU0Y8JkPrvm9EUBY8WdcyRjZ7U_6MbXGfxi9lgZesO5MaH373ALNYpbarkZhtC1DC2_JmpRXwpqgehBTzsdLTfrJt-fajvN7N_8rFfDpaMlmAi7Gl?purpose=inline\"/><p>1週間だけ貸す<\/p><p>すぐに返してもらえるので、短期間の資金の必要性や現在の金利を重視します。<\/p><img alt=\"【５０年返済】住宅ローンの長期化トレンドとその背景「夢のマイホームは未来への賭け？」｜細井久男\" class=\"exported-media\" src=\"https://images.openai.com/static-rsc-4/Dajjhr0fkaz1L7NbTLiAQHgIg5y7Wkm0n90aKVyF7IZaEjI6i3Xb-c_TdiFBxtPdMyEHKXbxLzaqaLk3nOpCuDd0LEkZQYMWeeyqbtvem8Brd6ho-_6iwzo-BmANVghyZCS0_NzqiMgpOBxDKsfkig0oJ0kimavH4pQSL71_d8w?purpose=inline\"/><p>10年間貸す<\/p><p>将来の物価や金利、返済能力など、長期間の不確実性を考える必要があります。<\/p><p>「10年間貸す場合、途中で物価が大きく上がったら、返してもらうお金の実質的な価値が下がるかもしれません。<\/p><p>だから長期の貸し借りでは、将来の見通しがとても重要になるんです。<\/p><p>ただし、長期金利が短期金利より必ず高いとは限りません。将来の利下げが強く予想されると、長期金利のほうが低くなることもあります。」<\/p><h2>D｜具体例：金利の変化で負担はいくら変わる？<\/h2><p>「では先輩、1,000万円を借りる場合で考えましょう。<\/p><p>金利が1%から3%になったら、1年間の利息はどれくらい変わるでしょうか？」<\/p><p>借入額<\/p><h2>1,000万円<\/h2><p>年利<\/p><h2>1.0%<\/h2><p>1年間の利息<\/p><h1>10万円<\/h1><p>1,000万円 × 1%<\/p><p>比較：年利1%と3%<\/p><p>年利1%：10万円／年<\/p><p>年利3%：30万円／年<\/p><p>差額：20万円／年<\/p>元本を1年間返済しない単利の概算です。住宅ローンの実際の返済額は返済方式・期間などによって異なります。<p>「初期値の1,000万円なら、年利1%で年間10万円、3%で年間30万円です。<\/p><p>金利が2ポイント上がるだけで、年間の利息負担が20万円変わるわけですね。」<\/p><h2>長期金利と短期金利の差：イールドカーブ<\/h2><p>「先輩、ここから一段深い話です。<\/p><p>短期金利と長期金利を並べると、イールドカーブという曲線を作れます。<\/p><p>これは、債券の残存期間と利回りの関係を表したものです。」<\/p>利回り<p>説明用の仮想データ。実際の市場金利ではありません。<\/p><p>順イールド<\/p><p>長期金利が短期金利より高い状態です。通常の上向きの形で、長期間の資金提供に対する上乗せ利回りなどが反映されています。<\/p><p>「特に逆イールドは経済ニュースでよく出てきます。<\/p><p>ただし、逆イールドになったから必ず景気後退する、という理解は正しくありません。あくまで複数ある経済指標の一つです。」<\/p><h2>投資や生活への影響<\/h2><table><tr><th>対象<\/th><th>短期金利の影響<\/th><th>長期金利の影響<\/th><\/tr><tr><td>住宅ローン<\/td><td>変動金利に影響しやすい<\/td><td>固定金利に影響しやすい<\/td><\/tr><tr><td>企業の借入<\/td><td>短期借入の金利<\/td><td>長期借入の金利<\/td><\/tr><tr><td>国債<\/td><td>短期国債の利回り<\/td><td>長期国債の利回り<\/td><\/tr><tr><td>株式<\/td><td>資金調達コストなど<\/td><td>企業価値の評価など<\/td><\/tr><tr><td>為替<\/td><td>政策金利差など<\/td><td>将来の金利見通しなど<\/td><\/tr><\/table><p>「先輩、株式投資では特に長期金利が重要です。<\/p><p>将来の利益を現在の価値に換算するときに使う割引率が上昇すると、一般に株式の理論価値は下がる方向に働きます。<\/p><p>特に利益の多くを遠い将来に期待する成長株は、割引率の変化に敏感になりやすいんです。<\/p><p>ただし、金利上昇が景気拡大を反映している場合は企業利益も増える可能性があるので、株価が必ず下がるわけではありません。」<\/p><h2>理解確認｜3問<\/h2><p>Q1. 日本の長期金利の代表的な指標は何ですか？<\/p>翌日物の短期金利10年物国債の利回り消費税率<p>Q2. 固定利付国債の価格が下がると、利回りは基本的にどうなりますか？<\/p>上昇する低下する必ず変わらない<p>Q3. 逆イールドとはどのような状態ですか？<\/p>長期金利が短期金利より高い長期金利と短期金利が必ずゼロになる短期金利が長期金利より高い<h2>30秒復習<\/h2><p>「先輩、最後に重要なポイントを確認しましょう。」<\/p><ul><li><p>短期金利とは？ 原則1年未満の貸し借りに関する金利。<\/p><\/li><li><p>長期金利とは？ 原則1年以上の貸し借りに関する金利。<\/p><\/li><li><p>短期金利を大きく動かすのは？ 中央銀行の金融政策。<\/p><\/li><li><p>長期金利を動かすのは？ 将来の短期金利予想、物価見通し、債券市場の需給など。<\/p><\/li><li><p>国債価格が下がると？ 利回りは上昇する。<\/p><\/li><li><p>逆イールドとは？ 短期金利が長期金利より高い状態。<\/p><\/li><li><p>住宅ローンとの関係は？ 変動金利は短期金利、固定金利は長期金利の影響を受けやすい。<\/p><\/li><\/ul><h2>一文記憶<\/h2><p>短期金利は中央銀行の政策の影響を直接受けやすく、長期金利は将来の金利や物価の見通しなどを反映して市場で決まる。<\/p><p>「先輩、経済ニュースで『日銀が利上げしたのに長期金利が下がった』と聞いても、もう不思議ではありませんね。<\/p><p>短期金利は今の金融政策、長期金利は将来の見通しにも左右される。<\/p><p>この違いを意識してニュースを読むと、金利と景気、株価の関係がずっと整理しやすくなりますよ。」<\/p><\/div>", "text": "⑧ 長期金利と短期金利 英語：Long-term Interest Rate（長期金利）／Short-term Interest Rate（短期金利） A｜要点：長期金利と短期金利は何が違う？ 「先輩、今回は経済ニュースを理解するうえで、とても重要な2つの金利です。 まず質問です。 銀行から1週間だけお金を借りる場合と、10年間借りる場合では、同じ金利になると思いますか？ 普通は違いますよね。 短期金利と長期金利の基本的な違いは、お金を貸し借りする期間の長さなんです。」 短期金利 1年未満 短い期間のお金の貸し借りに関する金利 長期金利 1年以上 長い期間のお金の貸し借りに関する金利 日本の経済ニュースでは、短期金利は日銀の政策金利、長期金利は10年物国債の利回りを代表的な指標として扱うことが多いです。 「ここで先輩に覚えてほしいのは、次の違いです。 短期金利は中央銀行の政策の影響を直接受けやすく、長期金利は将来の金利・物価・経済の見通しなどを反映しやすい。 これが今回の中心になります。」 B｜詳しい解説：金利はどうやって決まる？ ① 短期金利はなぜ日銀が動かせるのか 「先輩、日本銀行は日本の中央銀行ですよね。 日銀は物価の安定などを目的に金融政策を行っています。 その代表的な手段が、短期金利に働きかけることなんです。 例えば、物価が上昇しすぎているとき、日銀が政策金利を引き上げたとしましょう。」 ① 日銀が政策金利を引き上げる ② 銀行の短期的な資金調達金利などが上がる ③ 企業や家計の借入金利にも波及する ④ 設備投資や消費が抑制されやすくなる ⑤ 物価上昇を抑える方向に働く 「ただし、金利を上げた瞬間に物価が下がるわけではありません。 企業の投資計画や家計の支出が変化するまでには時間がかかりますし、為替や海外経済などの影響も受けます。」 ② 金融政策が経済に伝わる仕組み 「先輩、金利の引き下げと引き上げが、経済全体にどう影響するかも確認してみましょう。」 Demand (MD / AD)Supply (MS / SRAS)Long-run supply (LRAS)Money marketAD–ASMoney ↓→Rate ↑→Investment ↓→AD ↓Less money raises the interest rate to 6.1, lowers investment, and shifts AD leftPolicy typeExpansionaryContractionaryPolicy strengthPolicy strength 「これは金融引き締めと金融緩和の基本的なモデルです。 引き締めによって金利が上がると、設備投資などが減少し、総需要を抑える方向に働きます。 反対に緩和によって金利が下がると、投資や需要を刺激する方向に働きます。 ただし、実際の日銀は政策金利や資金供給など複数の手段を用いますから、図は基本的な仕組みを示したものですよ。」 ③ 長期金利はなぜ市場で決まるのか 「では先輩、10年物国債の利回りは、どうやって決まるのでしょう？ 基本的には、債券市場での売買を通じて決まります。 例えば、投資家が『これから物価が上昇し、日銀も金利を引き上げるだろう』と予想したとします。 すると、今の低い利回りの国債を買う魅力が小さくなるかもしれません。 国債が売られて価格が下がると、利回りは上昇します。」 固定利付国債の価格と利回り 国債価格が上昇 利回りは低下 国債価格が下落 利回りは上昇 「ここは大切ですよ。 国債価格と利回りは、基本的に反対方向に動くんです。 長期金利は、将来の短期金利の予想に加えて、物価上昇への見通しや、長期間資金を貸すことへの上乗せ利回りなどの影響を受けます。 だから日銀が短期金利を引き上げても、長期金利が必ず同じ幅だけ上がるとは限りません。」 C｜イメージ理解：短期と長期の貸し借り 「先輩、友人にお金を貸す場面を想像してください。」 1週間だけ貸す すぐに返してもらえるので、短期間の資金の必要性や現在の金利を重視します。 10年間貸す 将来の物価や金利、返済能力など、長期間の不確実性を考える必要があります。 「10年間貸す場合、途中で物価が大きく上がったら、返してもらうお金の実質的な価値が下がるかもしれません。 だから長期の貸し借りでは、将来の見通しがとても重要になるんです。 ただし、長期金利が短期金利より必ず高いとは限りません。将来の利下げが強く予想されると、長期金利のほうが低くなることもあります。」 D｜具体例：金利の変化で負担はいくら変わる？ 「では先輩、1,000万円を借りる場合で考えましょう。 金利が1%から3%になったら、1年間の利息はどれくらい変わるでしょうか？」 借入額 1,000万円 年利 1.0% 1年間の利息 10万円 1,000万円 × 1% 比較：年利1%と3% 年利1%：10万円／年 年利3%：30万円／年 差額：20万円／年 元本を1年間返済しない単利の概算です。住宅ローンの実際の返済額は返済方式・期間などによって異なります。 「初期値の1,000万円なら、年利1%で年間10万円、3%で年間30万円です。 金利が2ポイント上がるだけで、年間の利息負担が20万円変わるわけですね。」 長期金利と短期金利の差：イールドカーブ 「先輩、ここから一段深い話です。 短期金利と長期金利を並べると、イールドカーブという曲線を作れます。 これは、債券の残存期間と利回りの関係を表したものです。」 利回り 説明用の仮想データ。実際の市場金利ではありません。 順イールド 長期金利が短期金利より高い状態です。通常の上向きの形で、長期間の資金提供に対する上乗せ利回りなどが反映されています。 「特に逆イールドは経済ニュースでよく出てきます。 ただし、逆イールドになったから必ず景気後退する、という理解は正しくありません。あくまで複数ある経済指標の一つです。」 投資や生活への影響 対象 短期金利の影響 長期金利の影響 住宅ローン 変動金利に影響しやすい 固定金利に影響しやすい 企業の借入 短期借入の金利 長期借入の金利 国債 短期国債の利回り 長期国債の利回り 株式 資金調達コストなど 企業価値の評価など 為替 政策金利差など 将来の金利見通しなど 「先輩、株式投資では特に長期金利が重要です。 将来の利益を現在の価値に換算するときに使う割引率が上昇すると、一般に株式の理論価値は下がる方向に働きます。 特に利益の多くを遠い将来に期待する成長株は、割引率の変化に敏感になりやすいんです。 ただし、金利上昇が景気拡大を反映している場合は企業利益も増える可能性があるので、株価が必ず下がるわけではありません。」 理解確認｜3問 Q1. 日本の長期金利の代表的な指標は何ですか？ 翌日物の短期金利10年物国債の利回り消費税率 Q2. 固定利付国債の価格が下がると、利回りは基本的にどうなりますか？ 上昇する低下する必ず変わらない Q3. 逆イールドとはどのような状態ですか？ 長期金利が短期金利より高い長期金利と短期金利が必ずゼロになる短期金利が長期金利より高い 30秒復習 「先輩、最後に重要なポイントを確認しましょう。」 短期金利とは？ 原則1年未満の貸し借りに関する金利。 長期金利とは？ 原則1年以上の貸し借りに関する金利。 短期金利を大きく動かすのは？ 中央銀行の金融政策。 長期金利を動かすのは？ 将来の短期金利予想、物価見通し、債券市場の需給など。 国債価格が下がると？ 利回りは上昇する。 逆イールドとは？ 短期金利が長期金利より高い状態。 住宅ローンとの関係は？ 変動金利は短期金利、固定金利は長期金利の影響を受けやすい。 一文記憶 短期金利は中央銀行の政策の影響を直接受けやすく、長期金利は将来の金利や物価の見通しなどを反映して市場で決まる。 「先輩、経済ニュースで『日銀が利上げしたのに長期金利が下がった』と聞いても、もう不思議ではありませんね。 短期金利は今の金融政策、長期金利は将来の見通しにも左右される。 この違いを意識してニュースを読むと、金利と景気、株価の関係がずっと整理しやすくなりますよ。」"}, {"title": "⑨ 中秋の名月（ちゅうしゅうのめいげつ）", "html": "<div class=\"content\"><h1>⑨ 中秋の名月（ちゅうしゅうのめいげつ）<\/h1><p>英語：Harvest Moon（ハーヴェスト・ムーン）※近い表現ですが、天文学上の定義は異なります。<\/p><h2>A｜要点：中秋の名月とは何か<\/h2><p>「先輩、今回は日本の秋の風物詩ですね。<\/p><p>中秋の名月とは、旧暦8月15日の夜に見える月のことです。<\/p><p>『十五夜（じゅうごや）』とも呼ばれ、昔から月を眺めながら秋の収穫に感謝する風習が受け継がれてきました。<\/p><p>でも先輩、ここで一つ質問です。<\/p><p>中秋の名月は、必ず満月になると思いますか？<\/p><p>……実は、必ずしも満月とは限らないんです。<\/p><p>これが今回、特に覚えてほしいポイントですよ。」<\/p><img alt=\"なぜススキとお団子を飾るのか？十五夜に隠された「自然への感謝」｜Benvenuti natura(ベンヴェヌーティ ナトゥーラ)\" class=\"exported-media\" src=\"https://images.openai.com/static-rsc-4/FcUe8saPmiNgA5bX1560f9Sly8Ta_uTvdHw16jAVJFz2ZU4DtyVt5VQwS31Kpvn0DpK0SNUvbZrt3U7G6RV0KzLS4xbX_4NHaxERC3HE3ULETOhx78eiLly3lvaNVG1ywTnTJjSPhLfsP5TjuuIYCr5I5R56IhdHoFA03jFQcEw?purpose=inline\"/><p>中秋の名月の日付<\/p><h2>旧暦8月15日<\/h2><p>2026年の中秋の名月<\/p><h2>9月25日（金）<\/h2><p>毎年、新暦の日付は変わります。また、2026年の中秋の名月と満月の日付は一致しません。<\/p><h2>B｜詳しい解説：なぜ秋の月を特別に眺めるのか<\/h2><h3>① 「中秋」とはどういう意味？<\/h3><p>「先輩、まず『中秋』という言葉を分解してみましょう。<\/p><p>昔の暦では、秋は旧暦の7月・8月・9月の3か月でした。」<\/p><table><tr><th>旧暦<\/th><th>呼び方<\/th><\/tr><tr><td>7月<\/td><td>初秋（しょしゅう）<\/td><\/tr><tr><td>8月<\/td><td>仲秋（ちゅうしゅう）<\/td><\/tr><tr><td>9月<\/td><td>晩秋（ばんしゅう）<\/td><\/tr><\/table><p>「そして旧暦8月15日は、秋の期間のほぼ真ん中に当たります。<\/p><p>だから『中秋』の名月と呼ばれるんです。<\/p><p>ちなみに『仲秋』は秋の真ん中の月である旧暦8月を指し、『中秋』は秋の真ん中の日を指すという使い分けがあります。<\/p><p>似た字ですけれど、意味の違いも押さえてくださいね。」<\/p><h3>② なぜ秋の月が美しいとされるの？<\/h3><p>「先輩、月そのものが秋だけ特別に明るくなるわけではありません。<\/p><p>秋は、地域や天候によっては空気が澄み、月を眺めやすい季節です。<\/p><p>また、夏と比べて過ごしやすくなり、夜に月を鑑賞する文化とも結びついてきました。<\/p><p>ただし、秋でも曇りや雨の日はありますし、空の透明度はその日の気象条件によって変わります。<\/p><p>つまり、秋の月が美しいというのは、自然条件と日本の文化が重なって生まれた感覚なんです。」<\/p><h3>③ なぜ満月と一致しないことがあるの？<\/h3><p>「ここが少し難しいところですから、順番に考えましょう。<\/p><p>旧暦は月の満ち欠けを基準にしていました。<\/p><p>新月のころを月の始まりとして、15日ごろには満月に近づきます。<\/p><p>でも、月が新月から満月になるまでの時間は、いつもぴったり14日間というわけではありません。<\/p><p>月の公転速度などが変化するため、実際の満月が旧暦15日より後になることもあるんです。」<\/p><p>2026年の月の満ち欠け<\/p><img alt=\"Moon Phases - NASA Science\" class=\"exported-media\" src=\"https://images.openai.com/static-rsc-4/g7cWctMB7FKkGwcy1doO9gWprWMrBTUVCco_Eq7IcHYN3MvnnXQDsrZ_AhABLw4gdAJXO1LuZUAhrNoXmgQnn2_-aVmMy5KG8FPNfbncdoJd9aTCuDlPciHocMxSm5J_upT7msBN3Zf4kAr0hMocwb_9OhKz_8ZBibkOzoQzqrE?purpose=inline\"/><p>9月25日<\/p><p>中秋の名月<\/p><img alt=\"Very High Resolution Moon\" class=\"exported-media\" src=\"https://images.openai.com/static-rsc-4/nGchG50rFCuxqyBxtRX1oc5DlvDL6zFWzCjgRMzaxwXRG_da7hyJIDMSH3heXJNrpopzx36bNLYu1_3kzZjiB4nfNjiRTsAGchC6MpLVjwd5UjopBIFC-tTc4myq_Mn87DzbVUz2VaQrj2rR3ygcH_exdukj-k_jOM5o6ebHc0xtuiGfdlSiq00hxZa1i512?purpose=inline\"/><p>9月27日<\/p><p>満月<\/p><img alt=\"NASA SVS | Moon Phase and Libration, 2022\" class=\"exported-media\" src=\"https://images.openai.com/static-rsc-4/jnPWTVeWpgqlDLUMM9mEV1OvnZywshoEB5ImaZHb5WKox-g3PDSV2EJDp_lqmpzSGQJ7dDXQ0am3oMmlCP85yJfgvOcLYbnGf34na0IdIO9peqbLtnmOlHqQJq6-z1xDVOSDaRXtnJVYXrZg-2pDzCuKH2ZbRAGEEf7o4vHLFy4?purpose=inline\"/><p>満月の後<\/p><p>少しずつ欠ける<\/p>月の形のイメージです。2026年の満月は9月27日午前1時49分（日本時間）でした。<img alt=\"Image\" class=\"exported-media\" src=\"https://www.google.com/s2/favicons?domain=https://www.nao.ac.jp&amp;sz=32\"/>国立天文台(NAOJ)+1<p>「つまり先輩、中秋の名月は暦で決まる日、満月は月と太陽の位置関係で決まる天文現象なんです。<\/p><p>だから、両者の日付がずれることがあるんですね。」<\/p><h2>C｜イメージ理解：お月見の風景<\/h2><img alt=\"中秋の名月とは？十五夜とは違う？なぜお月見をして団子を食べるのか｜株式会社オマツリジャパン\" class=\"exported-media\" src=\"https://images.openai.com/static-rsc-4/3PTBQTasyL9pgOFLzLduDuAU7uL5BlHeDF2rL5IzAJ8QYuUfh93kTpsBjL5ntDBW1b61IYRBAzngJYLlZbDQ7qodiW99zxMMpLTlPRHK8WyMR96ps93WGRbqbfeutkFEdvLUHkK0_wZL6nDaM2a1UseBxwpVVReqyOF1eZ_tVnw?purpose=inline\"/><img alt=\"中秋の名月とは？意味や代表的な食べ物・十五夜との違いを解説 | デリッシュキッチン\" class=\"exported-media\" src=\"https://images.openai.com/static-rsc-4/7HfBd4fjMRCfW2FOfaNTMCFN6yqlhdzJm5QFJ3vYaKHApNZi0DlS2l9R63-i47hjBFSx-cag6mPSiVWnd2pf2XvdOIIIvCCvfq6-YlbJZSG06WOqg34lPUE8ddlgmSbOxjqb2S0YScl7oKZK66pEFlonjffH79REkfJdPgWq2vE?purpose=inline\"/><img alt=\"Complete Guide to Tsukimi | Rakuten Travel\" class=\"exported-media\" src=\"https://images.openai.com/static-rsc-4/qqLu_rstLvcmqdJScf1fqEQGk9Tn3SzFvjvA3SyVeyPUs-N45Qa_kdS_plsFF0x-3cGDDqVkPKHQQGFvEQCGGwoHHB6atMnL7P4K0L7zsn7gstvSHHORT0qZ4JGto942iOsjN15QpLq20aLLZm3R9p17FduRo67Gcj5h_G--lGU?purpose=inline\"/><p>「先輩、お月見といえば月見団子やススキを思い浮かべますよね。<\/p><p>でも、どうしてこの2つを飾るのでしょう？<\/p><p>月見団子は丸い月を表すとともに、収穫への感謝や豊作への願いを込めて供えられます。<\/p><p>ススキは稲穂に見立てられることがあり、魔除けの意味を持つとも伝えられています。<\/p><p>また、中秋の名月は『芋名月（いもめいげつ）』とも呼ばれ、里芋を供える風習もあるんですよ。<\/p><p>つまり、お月見は単に月を鑑賞するだけでなく、自然の恵みに感謝する行事でもあるんです。」<img alt=\"Image\" class=\"exported-media\" src=\"https://www.google.com/s2/favicons?domain=https://www.nao.ac.jp&amp;sz=32\"/>国立天文台(NAOJ)+1<\/p><h2>D｜具体例：中秋の名月と十三夜<\/h2><p>「先輩、日本にはもう一つ、秋の月を眺める『十三夜』という風習があります。<\/p><p>こちらは旧暦9月13日の月です。」<\/p><table><tr><th><\/th><th>中秋の名月<\/th><th>十三夜<\/th><\/tr><tr><td>旧暦<\/td><td>8月15日<\/td><td>9月13日<\/td><\/tr><tr><td>別名<\/td><td>芋名月<\/td><td>栗名月・豆名月<\/td><\/tr><tr><td>2026年<\/td><td>9月25日<\/td><td>10月23日<\/td><\/tr><tr><td>月の形<\/td><td>満月に近い<\/td><td>満月前の月<\/td><\/tr><\/table><p>「中秋の名月は中国から伝わった風習とされますが、十三夜のお月見は日本独自の風習として知られています。<\/p><p>両方の月を眺めることを『二夜の月』とも呼ぶんですよ。」<img alt=\"Image\" class=\"exported-media\" src=\"https://www.google.com/s2/favicons?domain=https://www.nao.ac.jp&amp;sz=32\"/>国立天文台(NAOJ)<\/p><h2>理解確認｜3問<\/h2><p>Q1. 中秋の名月は旧暦の何月何日ですか？<\/p>7月7日8月15日9月13日<p>Q2. 中秋の名月は必ず満月になりますか？<\/p>必ず満月になる満月とは限らない必ず半月になる<p>Q3. 中秋の名月が『芋名月』と呼ばれるのはなぜですか？<\/p>里芋を供える風習があるから月が芋の形になるから芋の収穫が禁止されていたから<h2>30秒復習<\/h2><p>「先輩、最後に確認しますよ。」<\/p><ul><li><p>中秋の名月とは？ 旧暦8月15日の夜の月。<\/p><\/li><li><p>必ず満月？ いいえ。満月とは限らない。<\/p><\/li><li><p>なぜ秋？ 秋の真ん中の月を鑑賞する伝統があるから。<\/p><\/li><li><p>何を供える？ 月見団子、ススキ、里芋など。<\/p><\/li><li><p>別名は？ 十五夜、芋名月。<\/p><\/li><li><p>十三夜とは？ 旧暦9月13日の月を鑑賞する日本独自の風習。<\/p><\/li><\/ul><h2>一文記憶<\/h2><p>中秋の名月は旧暦8月15日の月を愛で、秋の収穫に感謝する日本の伝統行事であり、必ずしも満月とは限らない。<\/p><p>「先輩、これから『中秋の名月』という言葉を聞いたら、単に満月を指すのではなく、昔の暦と収穫への感謝が結びついた言葉だと思い出してくださいね。」<\/p><\/div>", "text": "⑨ 中秋の名月（ちゅうしゅうのめいげつ） 英語：Harvest Moon（ハーヴェスト・ムーン）※近い表現ですが、天文学上の定義は異なります。 A｜要点：中秋の名月とは何か 「先輩、今回は日本の秋の風物詩ですね。 中秋の名月とは、旧暦8月15日の夜に見える月のことです。 『十五夜（じゅうごや）』とも呼ばれ、昔から月を眺めながら秋の収穫に感謝する風習が受け継がれてきました。 でも先輩、ここで一つ質問です。 中秋の名月は、必ず満月になると思いますか？ ……実は、必ずしも満月とは限らないんです。 これが今回、特に覚えてほしいポイントですよ。」 中秋の名月の日付 旧暦8月15日 2026年の中秋の名月 9月25日（金） 毎年、新暦の日付は変わります。また、2026年の中秋の名月と満月の日付は一致しません。 B｜詳しい解説：なぜ秋の月を特別に眺めるのか ① 「中秋」とはどういう意味？ 「先輩、まず『中秋』という言葉を分解してみましょう。 昔の暦では、秋は旧暦の7月・8月・9月の3か月でした。」 旧暦 呼び方 7月 初秋（しょしゅう） 8月 仲秋（ちゅうしゅう） 9月 晩秋（ばんしゅう） 「そして旧暦8月15日は、秋の期間のほぼ真ん中に当たります。 だから『中秋』の名月と呼ばれるんです。 ちなみに『仲秋』は秋の真ん中の月である旧暦8月を指し、『中秋』は秋の真ん中の日を指すという使い分けがあります。 似た字ですけれど、意味の違いも押さえてくださいね。」 ② なぜ秋の月が美しいとされるの？ 「先輩、月そのものが秋だけ特別に明るくなるわけではありません。 秋は、地域や天候によっては空気が澄み、月を眺めやすい季節です。 また、夏と比べて過ごしやすくなり、夜に月を鑑賞する文化とも結びついてきました。 ただし、秋でも曇りや雨の日はありますし、空の透明度はその日の気象条件によって変わります。 つまり、秋の月が美しいというのは、自然条件と日本の文化が重なって生まれた感覚なんです。」 ③ なぜ満月と一致しないことがあるの？ 「ここが少し難しいところですから、順番に考えましょう。 旧暦は月の満ち欠けを基準にしていました。 新月のころを月の始まりとして、15日ごろには満月に近づきます。 でも、月が新月から満月になるまでの時間は、いつもぴったり14日間というわけではありません。 月の公転速度などが変化するため、実際の満月が旧暦15日より後になることもあるんです。」 2026年の月の満ち欠け 9月25日 中秋の名月 9月27日 満月 満月の後 少しずつ欠ける 月の形のイメージです。2026年の満月は9月27日午前1時49分（日本時間）でした。 国立天文台(NAOJ)+1 「つまり先輩、中秋の名月は暦で決まる日、満月は月と太陽の位置関係で決まる天文現象なんです。 だから、両者の日付がずれることがあるんですね。」 C｜イメージ理解：お月見の風景 「先輩、お月見といえば月見団子やススキを思い浮かべますよね。 でも、どうしてこの2つを飾るのでしょう？ 月見団子は丸い月を表すとともに、収穫への感謝や豊作への願いを込めて供えられます。 ススキは稲穂に見立てられることがあり、魔除けの意味を持つとも伝えられています。 また、中秋の名月は『芋名月（いもめいげつ）』とも呼ばれ、里芋を供える風習もあるんですよ。 つまり、お月見は単に月を鑑賞するだけでなく、自然の恵みに感謝する行事でもあるんです。」 国立天文台(NAOJ)+1 D｜具体例：中秋の名月と十三夜 「先輩、日本にはもう一つ、秋の月を眺める『十三夜』という風習があります。 こちらは旧暦9月13日の月です。」 中秋の名月 十三夜 旧暦 8月15日 9月13日 別名 芋名月 栗名月・豆名月 2026年 9月25日 10月23日 月の形 満月に近い 満月前の月 「中秋の名月は中国から伝わった風習とされますが、十三夜のお月見は日本独自の風習として知られています。 両方の月を眺めることを『二夜の月』とも呼ぶんですよ。」 国立天文台(NAOJ) 理解確認｜3問 Q1. 中秋の名月は旧暦の何月何日ですか？ 7月7日8月15日9月13日 Q2. 中秋の名月は必ず満月になりますか？ 必ず満月になる満月とは限らない必ず半月になる Q3. 中秋の名月が『芋名月』と呼ばれるのはなぜですか？ 里芋を供える風習があるから月が芋の形になるから芋の収穫が禁止されていたから 30秒復習 「先輩、最後に確認しますよ。」 中秋の名月とは？ 旧暦8月15日の夜の月。 必ず満月？ いいえ。満月とは限らない。 なぜ秋？ 秋の真ん中の月を鑑賞する伝統があるから。 何を供える？ 月見団子、ススキ、里芋など。 別名は？ 十五夜、芋名月。 十三夜とは？ 旧暦9月13日の月を鑑賞する日本独自の風習。 一文記憶 中秋の名月は旧暦8月15日の月を愛で、秋の収穫に感謝する日本の伝統行事であり、必ずしも満月とは限らない。 「先輩、これから『中秋の名月』という言葉を聞いたら、単に満月を指すのではなく、昔の暦と収穫への感謝が結びついた言葉だと思い出してくださいね。」"}, {"title": "⑩ 土用の丑の日（どようのうしのひ）", "html": "<div class=\"content\"><h1>⑩ 土用の丑の日（どようのうしのひ）<\/h1><p>英語：Doyō no Ushi no Hi / Midsummer Day of the Ox<\/p><h2>A｜要点：土用の丑の日とは何か<\/h2><p>「先輩、土用の丑の日ですね。<\/p><p>この言葉を聞くと、やっぱりウナギを思い浮かべますよね。<\/p><p>でも先輩、どうして夏の特定の日にウナギを食べるのでしょうか？ そもそも『土用』と『丑』って、何を意味しているのでしょう？<\/p><p>実は、土用の丑の日とは、季節の変わり目に設けられた『土用』の期間中に巡ってくる、十二支の『丑』の日のことなんです。<\/p><p>つまり、もともとはウナギの日という意味ではないんですよ。」<\/p><img alt=\"7月24日と8月5日は「土用の丑の日」。うなぎが食べられる飲食チェーンまとめ | 飲食店ドットコム ジャーナル\" class=\"exported-media\" src=\"https://images.openai.com/static-rsc-4/dk8FercdBGhgwliffs4jr6olMemx9YD9AkcI2YA5y3UTFqdFNpb2al_9Yk0_chp-nvCRrdAAiAAv-CWm45T_tK869q2jjvYbJ_Q-NdbfWfUCZz0nnqJ1ZfGNGwztFFN7lEeEtZVblhXutsBgG1-UeiyjwSUd6OEhi51qvFD3XqM?purpose=inline\"/><p>言葉を2つに分けてみましょう<\/p><h1>土用<\/h1><p>季節の変わり目に設けられた期間<\/p><h1>丑の日<\/h1><p>十二支で「丑」に当たる日<\/p><p>この2つが重なった日が「土用の丑の日」です。<\/p><p>「そしてもう一つ大切なことがあります。<\/p><p>土用の丑の日は、夏だけではなく、春・夏・秋・冬にも存在します。<\/p><p>ただ、一般的に有名なのは夏の土用の丑の日なんです。」<\/p><h2>B｜詳しい解説：なぜ土用の丑の日があるのか<\/h2><h3>① 土用とは何か<\/h3><p>「先輩、まず『土用』から理解しましょう。<\/p><p>昔の東アジアでは、自然界のさまざまなものを『木・火・土・金・水』の5つに分類する五行思想がありました。<\/p><p>季節もこの考え方と結びつけられ、春は木、夏は火、秋は金、冬は水に対応します。<\/p><p>では、残った『土』はどうなるのでしょうか？<\/p><p>そこで、各季節の終わり、次の季節へ移り変わる時期に『土』を割り当てたんです。<\/p><p>これが土用の由来です。」<\/p><p>四季と土用の関係<\/p><p>春<\/p><p>五行：木<\/p><p>季節の終わりに土用<\/p><p>夏<\/p><p>五行：火<\/p><p>季節の終わりに土用<\/p><p>秋<\/p><p>五行：金<\/p><p>季節の終わりに土用<\/p><p>冬<\/p><p>五行：水<\/p><p>季節の終わりに土用<\/p>五行思想に基づく伝統的な季節の分類です。<p>「現在の暦では、土用は立春・立夏・立秋・立冬の直前、およそ18日間ずつに当たります。<\/p><p>ですから、夏の土用は立秋の前にあるんです。<\/p><p>『夏の土用なのに、秋の直前なの？』と思うかもしれませんね。<\/p><p>でも、昔の暦でいう立秋は、現在の感覚ではまだ暑い8月上旬です。だから夏バテが気になる時期と重なるんですよ。」<\/p><h3>② 丑の日とは何か<\/h3><p>「次は『丑』です。<\/p><p>先輩、十二支といえば、子・丑・寅・卯……という順番を知っていますよね。<\/p><p>十二支は年だけでなく、日を数えるためにも使われてきました。<\/p><p>つまり、12日ごとに丑の日が巡ってくるんです。」<\/p><p>十二支は12日で一巡します<\/p><p>子<\/p><p>1日目<\/p><p>丑<\/p><p>2日目<\/p><p>寅<\/p><p>3日目<\/p><p>卯<\/p><p>4日目<\/p><p>辰<\/p><p>5日目<\/p><p>巳<\/p><p>6日目<\/p><p>午<\/p><p>7日目<\/p><p>未<\/p><p>8日目<\/p><p>申<\/p><p>9日目<\/p><p>酉<\/p><p>10日目<\/p><p>戌<\/p><p>11日目<\/p><p>亥<\/p><p>12日目<\/p><p>12日後には再び「子」に戻り、その翌日が「丑」になります。<\/p><p>「土用は約18日間ありますが、丑の日は12日ごとに巡ってきます。<\/p><p>だから、一つの土用の期間中に丑の日が1回の年もあれば、2回の年もあるんです。<\/p><p>夏に2回ある場合は、最初を『一の丑（いちのうし）』、2回目を『二の丑（にのうし）』と呼びます。」<\/p><h3>③ なぜウナギを食べるのか<\/h3><p>「先輩、ここが一番気になるところですよね。<\/p><p>夏の土用の丑の日にウナギを食べる習慣については、江戸時代の蘭学者・平賀源内に関する有名な逸話があります。<\/p><p>夏場にウナギが売れず困っていた店に、源内が『本日土用丑の日』と掲げるよう助言したところ、商売が繁盛したという話です。<\/p><p>ただし、この逸話が史実であると確実に証明されているわけではありません。<\/p><p>また、丑の日に『う』の付く食べ物を食べるとよいという伝承もありました。<\/p><p>ウナギだけでなく、梅干しやうどん、瓜などもその例です。<\/p><p>こうした風習と商業的な宣伝が結びつき、夏の土用の丑の日にウナギを食べる習慣が広まったと考えられています。」<\/p><h2>C｜イメージ理解：昔のウナギ屋さん<\/h2><p>「先輩、江戸時代の商店街を想像してみてください。<\/p><p>暑い夏、ウナギ屋さんはお客さんが少なくて困っています。<\/p><p>そこで『今日は土用の丑の日！ ウナギを食べて暑さを乗り切ろう！』と宣伝したらどうでしょう。<\/p><p>それまでウナギを買う予定がなかった人も、『今日は特別な日なのか。それなら食べてみよう』と思うかもしれませんよね。」<\/p><img alt=\"蒲焼き：江戸情緒を楽しむ「蒲焼き」 | 伝統食品教室 | 紀文アカデミー | 紀文食品\" class=\"exported-media\" src=\"https://images.openai.com/static-rsc-4/XQzp3lPtH1NnG8LEcyAy8k3LX80J5Khvo5qv1nmThiL9-SbQvlE_VsjfO8e2UWDoJGvs_QcMdLb5kvAgDccwnqHDi6b0qJMNZr0GpwUK-grrNOMHpw3Jvug7_rSPZ_yRgXxIKbI64oolqd3KvX4qJY2S3BjIVrSdnuV76eb3Asw?purpose=inline\"/><p>「こうして、もともとあった暦の習慣と食べ物の販売が結びついた、というのが有名な説明です。<\/p><p>ただし、平賀源内が発案したというのは諸説ある起源の一つです。昔からウナギは夏の栄養補給に役立つ食べ物とも考えられていました。<img alt=\"Image\" class=\"exported-media\" src=\"https://www.google.com/s2/favicons?domain=https://crd.ndl.go.jp&amp;sz=32\"/>レファレンス協同データベース+1<\/p><p>現代で例えるなら、バレンタインデーにチョコレートを販売する習慣と少し似ています。<\/p><p>特定の日に食べ物を結びつけることで、季節の行事として定着していくんです。」<\/p><h2>D｜具体例：一の丑と二の丑<\/h2><p>「先輩、仮に夏の土用が7月20日から8月6日までだったとします。<\/p><p>その期間中、7月22日が丑の日なら、次の丑の日は12日後の8月3日です。」<\/p><p>説明用のカレンダー<\/p><p>7月22日<\/p><h1>一の丑<\/h1><p>1回目の丑の日<\/p><p>8月3日<\/p><h1>二の丑<\/h1><p>2回目の丑の日<\/p><p>丑の日は12日間隔<\/p>仕組みを理解するための仮定の日付です。<img alt=\"Image\" class=\"exported-media\" src=\"https://www.google.com/s2/favicons?domain=https://crd.ndl.go.jp&amp;sz=32\"/>レファレンス協同データベース<p>「つまり、土用が約18日間あるので、その中に12日間隔の丑の日が2回入る場合があるんです。<\/p><p>毎年必ず2回あるわけではありませんよ。」<\/p><h2>理解確認｜3問<\/h2><p>Q1. 「土用」とは何を指しますか？<\/p>土曜日のこと季節の変わり目の約18日間夏至の日だけ<p>Q2. 「丑の日」は何日ごとに巡ってきますか？<\/p>7日10日12日<p>Q3. 夏の土用の丑の日にウナギを食べる習慣について、正しい説明はどれですか？<\/p>平賀源内が始めたことが史実として確定している江戸時代の宣伝と結びついたという説が有名ウナギ以外を食べてはいけない<h2>30秒復習<\/h2><p>「先輩、最後に確認しますよ。」<\/p><ul><li><p>土用とは？ 季節の変わり目にある約18日間。<\/p><\/li><li><p>年に何回？ 春・夏・秋・冬の4回。<\/p><\/li><li><p>丑の日とは？ 十二支の丑が割り当てられた日。<\/p><\/li><li><p>何日ごと？ 12日ごと。<\/p><\/li><li><p>二の丑とは？ 同じ土用期間に巡ってくる2回目の丑の日。<\/p><\/li><li><p>なぜウナギ？ 夏の栄養補給の風習や江戸時代の宣伝が結びついたと考えられている。<\/p><\/li><li><p>平賀源内が始めた？ 有名な説だが、確定した史実ではない。<\/p><\/li><\/ul><h2>一文記憶<\/h2><p>土用の丑の日は、季節の変わり目である土用期間中の丑の日で、特に夏にはウナギを食べて暑さを乗り切る風習がある。<\/p><p>「先輩、これで『土用の丑の日』という言葉を見ても、ただのウナギの日ではなく、暦の仕組みと日本の食文化が結びついた日だと理解できますね。<\/p><p>『土用＝季節の変わり目』『丑＝12日ごと』。まずはこの2つを覚えてください。」<\/p><\/div>", "text": "⑩ 土用の丑の日（どようのうしのひ） 英語：Doyō no Ushi no Hi / Midsummer Day of the Ox A｜要点：土用の丑の日とは何か 「先輩、土用の丑の日ですね。 この言葉を聞くと、やっぱりウナギを思い浮かべますよね。 でも先輩、どうして夏の特定の日にウナギを食べるのでしょうか？ そもそも『土用』と『丑』って、何を意味しているのでしょう？ 実は、土用の丑の日とは、季節の変わり目に設けられた『土用』の期間中に巡ってくる、十二支の『丑』の日のことなんです。 つまり、もともとはウナギの日という意味ではないんですよ。」 言葉を2つに分けてみましょう 土用 季節の変わり目に設けられた期間 丑の日 十二支で「丑」に当たる日 この2つが重なった日が「土用の丑の日」です。 「そしてもう一つ大切なことがあります。 土用の丑の日は、夏だけではなく、春・夏・秋・冬にも存在します。 ただ、一般的に有名なのは夏の土用の丑の日なんです。」 B｜詳しい解説：なぜ土用の丑の日があるのか ① 土用とは何か 「先輩、まず『土用』から理解しましょう。 昔の東アジアでは、自然界のさまざまなものを『木・火・土・金・水』の5つに分類する五行思想がありました。 季節もこの考え方と結びつけられ、春は木、夏は火、秋は金、冬は水に対応します。 では、残った『土』はどうなるのでしょうか？ そこで、各季節の終わり、次の季節へ移り変わる時期に『土』を割り当てたんです。 これが土用の由来です。」 四季と土用の関係 春 五行：木 季節の終わりに土用 夏 五行：火 季節の終わりに土用 秋 五行：金 季節の終わりに土用 冬 五行：水 季節の終わりに土用 五行思想に基づく伝統的な季節の分類です。 「現在の暦では、土用は立春・立夏・立秋・立冬の直前、およそ18日間ずつに当たります。 ですから、夏の土用は立秋の前にあるんです。 『夏の土用なのに、秋の直前なの？』と思うかもしれませんね。 でも、昔の暦でいう立秋は、現在の感覚ではまだ暑い8月上旬です。だから夏バテが気になる時期と重なるんですよ。」 ② 丑の日とは何か 「次は『丑』です。 先輩、十二支といえば、子・丑・寅・卯……という順番を知っていますよね。 十二支は年だけでなく、日を数えるためにも使われてきました。 つまり、12日ごとに丑の日が巡ってくるんです。」 十二支は12日で一巡します 子 1日目 丑 2日目 寅 3日目 卯 4日目 辰 5日目 巳 6日目 午 7日目 未 8日目 申 9日目 酉 10日目 戌 11日目 亥 12日目 12日後には再び「子」に戻り、その翌日が「丑」になります。 「土用は約18日間ありますが、丑の日は12日ごとに巡ってきます。 だから、一つの土用の期間中に丑の日が1回の年もあれば、2回の年もあるんです。 夏に2回ある場合は、最初を『一の丑（いちのうし）』、2回目を『二の丑（にのうし）』と呼びます。」 ③ なぜウナギを食べるのか 「先輩、ここが一番気になるところですよね。 夏の土用の丑の日にウナギを食べる習慣については、江戸時代の蘭学者・平賀源内に関する有名な逸話があります。 夏場にウナギが売れず困っていた店に、源内が『本日土用丑の日』と掲げるよう助言したところ、商売が繁盛したという話です。 ただし、この逸話が史実であると確実に証明されているわけではありません。 また、丑の日に『う』の付く食べ物を食べるとよいという伝承もありました。 ウナギだけでなく、梅干しやうどん、瓜などもその例です。 こうした風習と商業的な宣伝が結びつき、夏の土用の丑の日にウナギを食べる習慣が広まったと考えられています。」 C｜イメージ理解：昔のウナギ屋さん 「先輩、江戸時代の商店街を想像してみてください。 暑い夏、ウナギ屋さんはお客さんが少なくて困っています。 そこで『今日は土用の丑の日！ ウナギを食べて暑さを乗り切ろう！』と宣伝したらどうでしょう。 それまでウナギを買う予定がなかった人も、『今日は特別な日なのか。それなら食べてみよう』と思うかもしれませんよね。」 「こうして、もともとあった暦の習慣と食べ物の販売が結びついた、というのが有名な説明です。 ただし、平賀源内が発案したというのは諸説ある起源の一つです。昔からウナギは夏の栄養補給に役立つ食べ物とも考えられていました。 レファレンス協同データベース+1 現代で例えるなら、バレンタインデーにチョコレートを販売する習慣と少し似ています。 特定の日に食べ物を結びつけることで、季節の行事として定着していくんです。」 D｜具体例：一の丑と二の丑 「先輩、仮に夏の土用が7月20日から8月6日までだったとします。 その期間中、7月22日が丑の日なら、次の丑の日は12日後の8月3日です。」 説明用のカレンダー 7月22日 一の丑 1回目の丑の日 8月3日 二の丑 2回目の丑の日 丑の日は12日間隔 仕組みを理解するための仮定の日付です。 レファレンス協同データベース 「つまり、土用が約18日間あるので、その中に12日間隔の丑の日が2回入る場合があるんです。 毎年必ず2回あるわけではありませんよ。」 理解確認｜3問 Q1. 「土用」とは何を指しますか？ 土曜日のこと季節の変わり目の約18日間夏至の日だけ Q2. 「丑の日」は何日ごとに巡ってきますか？ 7日10日12日 Q3. 夏の土用の丑の日にウナギを食べる習慣について、正しい説明はどれですか？ 平賀源内が始めたことが史実として確定している江戸時代の宣伝と結びついたという説が有名ウナギ以外を食べてはいけない 30秒復習 「先輩、最後に確認しますよ。」 土用とは？ 季節の変わり目にある約18日間。 年に何回？ 春・夏・秋・冬の4回。 丑の日とは？ 十二支の丑が割り当てられた日。 何日ごと？ 12日ごと。 二の丑とは？ 同じ土用期間に巡ってくる2回目の丑の日。 なぜウナギ？ 夏の栄養補給の風習や江戸時代の宣伝が結びついたと考えられている。 平賀源内が始めた？ 有名な説だが、確定した史実ではない。 一文記憶 土用の丑の日は、季節の変わり目である土用期間中の丑の日で、特に夏にはウナギを食べて暑さを乗り切る風習がある。 「先輩、これで『土用の丑の日』という言葉を見ても、ただのウナギの日ではなく、暦の仕組みと日本の食文化が結びついた日だと理解できますね。 『土用＝季節の変わり目』『丑＝12日ごと』。まずはこの2つを覚えてください。」"}, {"title": "⑪ 彼岸（ひがん）", "html": "<div class=\"content\"><h1>⑪ 彼岸（ひがん）<\/h1><p>英語：Higan / Buddhist Equinoctial Week<\/p><h2>A｜要点：彼岸とは何か<\/h2><p>「先輩、今回は『彼岸』ですね。<\/p><p>お彼岸と聞くと、お墓参りやおはぎを思い浮かべるのではありませんか？<\/p><p>でも、どうして春と秋にお墓参りをするのでしょう。それに、そもそも『彼岸』とは何を意味する言葉なのでしょうか。<\/p><p>実は、彼岸とは、仏教で迷いや苦しみを離れた悟りの世界を意味する言葉なんです。<\/p><p>そして日本では、春分の日と秋分の日を中心とする、それぞれ7日間に先祖を供養する習慣が定着しました。」<\/p><img alt=\"暦を学ぼう：春分の日は、ご先祖さまと家族に“ありがとう”を伝える日 | まいぷれ草加市編集部のニュース | まいぷれ[草加市]\" class=\"exported-media\" src=\"https://images.openai.com/static-rsc-4/o7KMQ0t0CUAuVLZx-f_SFXON8wv8Cs5HsWIRJc8_ilgVDacCtZ4Ydj_ujzyMswoBMV3ahhGP3DklwJ8nvq7DeoZPXN1x0bQWmLlYSXhIVRLTmogzyssfnmnPl-u6gSzOOZA5dbKFq0MuzBgFqewbiQVT-BpZCfH3cHT4RZBGp3g?purpose=inline\"/><p>彼岸には2つの意味があります<\/p><p>仏教上の意味<\/p><p>迷いや苦しみを超えた、悟りの境地<\/p><p>日本の年中行事<\/p><p>春分・秋分を中心に先祖を供養する期間<\/p><p>「先輩、ここは大切です。<\/p><p>『彼岸＝お墓参りの日』だけで覚えてしまうと、言葉の本来の意味を見落としてしまいます。<\/p><p>彼岸はもともと仏教の考え方で、日本ではそこに先祖供養の習慣が結びついたんですよ。」<\/p><h2>B｜詳しい解説：なぜ春分と秋分にお彼岸があるのか<\/h2><h3>① 彼岸と此岸の違い<\/h3><p>「まず『彼岸』という漢字を見てください。<\/p><p>『彼』は向こう側、『岸』は岸辺を意味します。<\/p><p>つまり、彼岸とは向こう岸のことなんです。<\/p><p>では、こちら側の岸は何と呼ぶのでしょう？<\/p><p>答えは**此岸（しがん）**です。」<\/p><img alt=\"Image\" class=\"exported-media\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAQ8AAACWCAYAAADAMQ0BAAAQAElEQVR4Aex9B2BcV5X296ZIo65Rr7YkS3LvvSVOg4TEhDRIAQLJEkhIKLvsD+zy1y0sy+7SW1hCDSUBQiAVJ3GPWxz3brlIsnqXRtL0/ztPGnlUPRrNSCPpynPm3nvuue28e7937rlvng1Qf0oDSgNKA0FoQIFHEEpTRZQGlAYABR5qFigNKA0EpQEFHkGpTRVSGuivgemYUuAxHa+6GrPSQAg0oMAjBEpUVSgNTEcNKPCYjlddjVlpIAQaUO ね。<\/p><p>一方、日本では、先祖や亡くなった家族に思いを向ける行事として発展してきました。<\/p><p>例えば、普段は忙しくてお墓参りに行けない家族が、お彼岸の時期に集まったとしましょう。<\/p><p>お墓を掃除して花を供え、手を合わせる。<\/p><p>そのとき、亡くなった家族との思い出や、今の自分の生活について考えることがありますよね。<\/p><p>このように、お彼岸は先祖を供養するとともに、自分自身の生き方を見つめる機会にもなるんです。」<\/p><img alt=\"Asian family visiting the grave\" class=\"exported-media\" src=\"https://images.openai.com/static-rsc-4/r8G9SFP8bZAqZQFobRyYh9XBQXmH_C6Fwo1LJ-hPF1D-h4_XeicTPTIv3zSMgtl_HrGjqAUW0diK7mc43Hwx3yyI8cq06OrZfsy_49xSHVlD7cBTG_kvRh8DC4V_IYAg62EVtdl_FpRxL0L3HHOffxrj6vsfloFro3J6EJ6mM4klzv9sAbV9u2OG2XQ2O-SS?purpose=inline\"/><p>お墓参り<\/p><p>墓石の掃除、花や線香のお供え、合掌などを行います。<\/p><img alt=\"Traditional Japanese Ohagi – Sweet Rice Cakes with Red Bean and Kinako\" class=\"exported-media\" src=\"https://images.openai.com/static-rsc-4/0cMsmYMo7T7Puueu10xF3s6JHilvtc99SA22igo-MeubS-qmXY5vz8laofHtA7s_62IGUplxC6DV_Lcl2Vnd12BX0CBmCB0bu9rXAB7rJxqa5S5sIXICotxC0yt-tFpG6ERD_UwDuAu-Dz8DnXoXGgBirW2AZaD1OjvHYkqIPHBBu1XXAT56LX-O1eJvf-87?purpose=inline\"/><p>お供え物<\/p><p>ぼたもちやおはぎなどを供える習慣があります。<\/p><p>「もちろん、宗派や地域、家庭によって行事の内容は違います。<\/p><p>お墓参りをしないと彼岸の意味がなくなる、ということではありませんよ。」<\/p><h3>ぼたもちとおはぎの違い<\/h3><p>「先輩、ここで一つ面白い話です。<\/p><p>春のお彼岸には『ぼたもち』、秋のお彼岸には『おはぎ』という名前が使われることがあります。<\/p><p>どちらも、もち米などを使い、あんこで包んだ和菓子です。」<\/p><img alt=\"春分の日にすることって？行事食はある？｜HALMEK up（ハルメクアップ）\" class=\"exported-media\" src=\"https://images.openai.com/static-rsc-4/TKwinDWPGvpYtwvoksKHMA9LsDNW7G-9QjOpoBp_HfI-EcyL53ciNNv0gENEGykdq-bBY-1OADZsyQXebe3uI2Wx0Cu6wC_yp4sQSEnIT5H3hjSwsuHasOsJ8XB8FNGWm0QwID95HIiZpvln7T0Vtd4V3iUdigz00wdDlo2ImnE?purpose=inline\"/><p>春：ぼたもち<\/p><p>春に咲く牡丹（ぼたん）の花に由来する名前です。<\/p><img alt=\"Silver Week continues in Japan with Higan on Sept. 23 | Stripes Okinawa\" class=\"exported-media\" src=\"https://images.openai.com/static-rsc-4/p18S4Yyt4tvPQ_ru7iAlVWHTIu6Ln4wfS1Uw-BXTnMlh8qMfpk2xEG_I0Zj4fEo9031pDK3E5GRp_pJAeotWj3BSo7ElZ4sID9zjRYjuhQjLJ2UeyEG94pPHCeUBrXm-nHm6jOb-MZMpWb7TAXWh0CTsoYfr2-JAz62J0m9fmnc?purpose=inline\"/><p>秋：おはぎ<\/p><p>秋に咲く萩（はぎ）の花に由来する名前です。<\/p><p>「昔は大きさやあんこの種類で区別する説明もありましたが、現在は地域やお店によって呼び方が異なります。<\/p><p>ぼたもちとおはぎは、基本的にはよく似た和菓子だと理解しておけば大丈夫です。」<\/p><h2>D｜具体例：2026年のお彼岸<\/h2><p>「では先輩、2026年の日付を確認しましょう。」<\/p><p>春のお彼岸<\/p><h2>3月17日〜3月23日<\/h2><p>彼岸入り：3月17日／中日（春分の日）：3月20日／彼岸明け：3月23日<\/p><p>秋のお彼岸<\/p><h2>9月20日〜9月26日<\/h2><p>彼岸入り：9月20日／中日（秋分の日）：9月23日／彼岸明け：9月26日<\/p>2026年の日本の暦に基づく日付です。<p>「先輩、ここで『お盆』との違いも整理しておきましょう。」<\/p><table><tr><th><\/th><th>お彼岸<\/th><th>お盆<\/th><\/tr><tr><td>時期<\/td><td>春分・秋分の前後<\/td><td>主に7月または8月<\/td><\/tr><tr><td>回数<\/td><td>年2回<\/td><td>年1回<\/td><\/tr><tr><td>主な意味<\/td><td>先祖供養と仏教の修行・悟りへの思い<\/td><td>先祖の霊を迎え供養する<\/td><\/tr><tr><td>主な習慣<\/td><td>墓参り・お供え<\/td><td>迎え火・送り火・墓参りなど<\/td><\/tr><\/table><p>「お彼岸もお盆も先祖供養に関係しますが、成り立ちや時期が異なるんです。<\/p><p>なお、お盆の行事も地域や宗派によって違いがありますよ。」<\/p><h2>理解確認｜3問<\/h2><p>Q1. 仏教における『彼岸』の本来の意味は何ですか？<\/p>迷いや苦しみのある世界悟りの世界春分の日そのもの<p>Q2. お彼岸は春分・秋分の日を中心に何日間ありますか？<\/p>3日間5日間7日間<p>Q3. 『おはぎ』の名前の由来となった花はどれですか？<\/p>萩牡丹桜<h2>30秒復習<\/h2><p>「先輩、最後に重要なポイントを確認しますよ。」<\/p><ul><li><p>彼岸とは？ 仏教で迷いを超えた悟りの世界。<\/p><\/li><li><p>此岸とは？ 迷いや苦しみのある、こちら側の世界。<\/p><\/li><li><p>お彼岸はいつ？ 春分の日と秋分の日を中心とする7日間。<\/p><\/li><li><p>年に何回？ 春と秋の2回。<\/p><\/li><li><p>なぜ春分・秋分？ 太陽がほぼ真西に沈み、西方浄土への信仰と結びついたため。<\/p><\/li><li><p>何をする？ お墓参りや先祖供養など。<\/p><\/li><li><p>ぼたもちとおはぎの違いは？ 春の牡丹と秋の萩に由来する呼び名。<\/p><\/li><\/ul><h2>一文記憶<\/h2><p>彼岸とは仏教で悟りの世界を意味し、日本では春分・秋分を中心とした7日間に先祖を供養する行事として定着したものである。<\/p><p>「先輩、最後にもう一度。<\/p><p>彼岸は単なるお墓参りの期間ではありません。<\/p><p>此岸という迷いの世界から、彼岸という悟りの世界を目指す。<\/p><p>この仏教的な意味と、日本の先祖供養の習慣を結びつけて覚えてくださいね。」<\/p><\/div>", "text": "⑪ 彼岸（ひがん） 英語：Higan / Buddhist Equinoctial Week A｜要点：彼岸とは何か 「先輩、今回は『彼岸』ですね。 お彼岸と聞くと、お墓参りやおはぎを思い浮かべるのではありませんか？ でも、どうして春と秋にお墓参りをするのでしょう。それに、そもそも『彼岸』とは何を意味する言葉なのでしょうか。 実は、彼岸とは、仏教で迷いや苦しみを離れた悟りの世界を意味する言葉なんです。 そして日本では、春分の日と秋分の日を中心とする、それぞれ7日間に先祖を供養する習慣が定着しました。」 彼岸には2つの意味があります 仏教上の意味 迷いや苦しみを超えた、悟りの境地 日本の年中行事 春分・秋分を中心に先祖を供養する期間 「先輩、ここは大切です。 『彼岸＝お墓参りの日』だけで覚えてしまうと、言葉の本来の意味を見落としてしまいます。 彼岸はもともと仏教の考え方で、日本ではそこに先祖供養の習慣が結びついたんですよ。」 B｜詳しい解説：なぜ春分と秋分にお彼岸があるのか ① 彼岸と此岸の違い 「まず『彼岸』という漢字を見てください。 『彼』は向こう側、『岸』は岸辺を意味します。 つまり、彼岸とは向こう岸のことなんです。 では、こちら側の岸は何と呼ぶのでしょう？ 答えは**此岸（しがん）**です。」 「此岸は、欲望や怒り、執着などにとらわれた私たちの迷いの世界を表します。 一方、彼岸は、そうした迷いを超えた悟りの世界です。 仏教では、修行や智慧によって迷いから解放されることを、川のこちら岸から向こう岸へ渡ることに例えるんです。 ですから、彼岸は本来、亡くなった人がいる場所だけを意味する言葉ではありません。 悟りという目標そのものを表す言葉でもあるんですよ。」 ② なぜ春分と秋分なのか 「先輩、春分の日と秋分の日には、太陽がほぼ真東から昇り、ほぼ真西に沈むという特徴があります。 そして仏教の浄土信仰では、阿弥陀仏の極楽浄土は西方にあると考えられてきました。 そのため、太陽が真西に沈む春分・秋分は、西方浄土を思い起こす日として意味を持つようになったと説明されています。 そこに日本古来の祖先を敬う習慣なども結びつき、春と秋のお彼岸が定着したと考えられています。」 「ただし、春分・秋分の日は、世界中のすべての場所で昼と夜の長さが厳密に12時間ずつになるわけではありません。 大気による光の屈折などの影響で、実際の日の出から日の入りまでの時間は少し長くなります。 『昼と夜がほぼ同じ長さになる時期』と理解してくださいね。」 ③ お彼岸は何日間あるのか 「ここは数字で覚えましょう。 お彼岸は、春分の日または秋分の日を真ん中にした7日間です。」 お彼岸の7日間 1日目 入 2日目 ・ 3日目 ・ 4日目 中 5日目 ・ 6日目 ・ 7日目 明 彼岸入り 中日 彼岸明け 春分・秋分の日の前3日＋当日＋後3日＝合計7日間 「最初の日を『彼岸入り』、真ん中の日を『中日（ちゅうにち）』、最後の日を『彼岸明け』と呼びます。 春と秋にそれぞれ7日間あるので、年に合計14日間ですね。」 C｜イメージ理解：なぜお墓参りをするのか 「先輩、仏教の本来の意味では、彼岸は悟りの世界でしたよね。 一方、日本では、先祖や亡くなった家族に思いを向ける行事として発展してきました。 例えば、普段は忙しくてお墓参りに行けない家族が、お彼岸の時期に集まったとしましょう。 お墓を掃除して花を供え、手を合わせる。 そのとき、亡くなった家族との思い出や、今の自分の生活について考えることがありますよね。 このように、お彼岸は先祖を供養するとともに、自分自身の生き方を見つめる機会にもなるんです。」 お墓参り 墓石の掃除、花や線香のお供え、合掌などを行います。 お供え物 ぼたもちやおはぎなどを供える習慣があります。 「もちろん、宗派や地域、家庭によって行事の内容は違います。 お墓参りをしないと彼岸の意味がなくなる、ということではありませんよ。」 ぼたもちとおはぎの違い 「先輩、ここで一つ面白い話です。 春のお彼岸には『ぼたもち』、秋のお彼岸には『おはぎ』という名前が使われることがあります。 どちらも、もち米などを使い、あんこで包んだ和菓子です。」 春：ぼたもち 春に咲く牡丹（ぼたん）の花に由来する名前です。 秋：おはぎ 秋に咲く萩（はぎ）の花に由来する名前です。 「昔は大きさやあんこの種類で区別する説明もありましたが、現在は地域やお店によって呼び方が異なります。 ぼたもちとおはぎは、基本的にはよく似た和菓子だと理解しておけば大丈夫です。」 D｜具体例：2026年のお彼岸 「では先輩、2026年の日付を確認しましょう。」 春のお彼岸 3月17日〜3月23日 彼岸入り：3月17日／中日（春分の日）：3月20日／彼岸明け：3月23日 秋のお彼岸 9月20日〜9月26日 彼岸入り：9月20日／中日（秋分の日）：9月23日／彼岸明け：9月26日 2026年の日本の暦に基づく日付です。 「先輩、ここで『お盆』との違いも整理しておきましょう。」 お彼岸 お盆 時期 春分・秋分の前後 主に7月または8月 回数 年2回 年1回 主な意味 先祖供養と仏教の修行・悟りへの思い 先祖の霊を迎え供養する 主な習慣 墓参り・お供え 迎え火・送り火・墓参りなど 「お彼岸もお盆も先祖供養に関係しますが、成り立ちや時期が異なるんです。 なお、お盆の行事も地域や宗派によって違いがありますよ。」 理解確認｜3問 Q1. 仏教における『彼岸』の本来の意味は何ですか？ 迷いや苦しみのある世界悟りの世界春分の日そのもの Q2. お彼岸は春分・秋分の日を中心に何日間ありますか？ 3日間5日間7日間 Q3. 『おはぎ』の名前の由来となった花はどれですか？ 萩牡丹桜 30秒復習 「先輩、最後に重要なポイントを確認しますよ。」 彼岸とは？ 仏教で迷いを超えた悟りの世界。 此岸とは？ 迷いや苦しみのある、こちら側の世界。 お彼岸はいつ？ 春分の日と秋分の日を中心とする7日間。 年に何回？ 春と秋の2回。 なぜ春分・秋分？ 太陽がほぼ真西に沈み、西方浄土への信仰と結びついたため。 何をする？ お墓参りや先祖供養など。 ぼたもちとおはぎの違いは？ 春の牡丹と秋の萩に由来する呼び名。 一文記憶 彼岸とは仏教で悟りの世界を意味し、日本では春分・秋分を中心とした7日間に先祖を供養する行事として定着したものである。 「先輩、最後にもう一度。 彼岸は単なるお墓参りの期間ではありません。 此岸という迷いの世界から、彼岸という悟りの世界を目指す。 この仏教的な意味と、日本の先祖供養の習慣を結びつけて覚えてくださいね。」"}]</script><script>
const cards=JSON.parse(document.getElementById('dataset').textContent);let index=0;const key='study-11-20261027';let store={};try{store=JSON.parse(localStorage.getItem(key)||'{}')}catch{};const save=()=>{try{localStorage.setItem(key,JSON.stringify(store))}catch{}};
const nav=document.getElementById('nav'),content=document.getElementById('content'),search=document.getElementById('search'),section=document.getElementById('section');
function filtered(){const q=search.value.trim().toLocaleLowerCase();return cards.map((c,i)=>({...c,i})).filter(c=>!q||(c.title+' '+c.text).toLocaleLowerCase().includes(q))}
function render(){const visible=filtered();if(!visible.some(c=>c.i===index)&&visible.length)index=visible[0].i;nav.replaceChildren();visible.forEach(c=>{let b=document.createElement('button');b.textContent=(store[c.i]?.done?'✓ ':'')+(store[c.i]?.fav?'★ ':'')+c.title;b.className=c.i===index?'selected':'';b.onclick=()=>{index=c.i;render()};nav.append(b)});if(!visible.length){content.textContent='一致する項目はありません。';return}content.innerHTML=cards[index].html;const v=section.value;if(v!=='all'){const container=content.querySelector('.content');if(container){const children=[...container.children];let active=false;for(const el of children){const t=el.textContent.trim();if(el.tagName==='H2'){if(v==='A'||v==='B'||v==='C'||v==='D'){active=t.startsWith(v+'｜')||t.startsWith(v+'：')}else{active=t.includes(v)}}else if(el.tagName==='H1'&&el===children[0]){active=true}if(el!==children[0])el.classList.toggle('hidden',!active)}}}document.getElementById('done').textContent=store[index]?.done?'✓ 学習済み':'学習済みにする';document.getElementById('fav').textContent=store[index]?.fav?'★ お気に入り':'☆ お気に入り';document.getElementById('progress').textContent=`${index+1} / ${cards.length} 項目・学習済み ${Object.values(store).filter(x=>x.done).length} 件`;}
function step(d){const vis=filtered();let p=vis.findIndex(c=>c.i===index);index=vis[(p+d+vis.length)%vis.length]?.i??index;render();window.scrollTo({top:0,behavior:'smooth'})}document.getElementById('prev').onclick=()=>step(-1);document.getElementById('next').onclick=()=>step(1);document.getElementById('random').onclick=()=>{const vis=filtered();if(vis.length){index=vis[Math.floor(Math.random()*vis.length)].i;render()}};document.getElementById('done').onclick=()=>{store[index]??={};store[index].done=!store[index].done;save();render()};document.getElementById('fav').onclick=()=>{store[index]??={};store[index].fav=!store[index].fav;save();render()};search.oninput=render;section.onchange=render;render();
</script><script id="image-extension-script">(function(){const oldRender=render;render=function(){oldRender();const root=document.querySelector('#content .content');if(!root)return;const headings=[...root.querySelectorAll('h2')];const target=headings.find(h=>/^C[｜：]/.test(h.textContent.trim()));const anchor=target||root.querySelector('h1');if(!anchor)return;const fig=document.createElement('figure');fig.className='concept-image';const pic=document.createElement('img');pic.src='images/card_'+String(index+1).padStart(2,'0')+'.png';pic.alt=cards[index].title+'の概念を表すAI生成イメージ図';pic.loading='lazy';fig.append(pic);const cap=document.createElement('figcaption');cap.textContent='イメージ図｜'+cards[index].title+'（AI生成画像）';fig.append(cap);anchor.insertAdjacentElement('afterend',fig);if(section.value!=='all'){fig.classList.toggle('hidden',!!target && target.classList.contains('hidden'))}};render()})();</script></body></html>
